<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>영유아 공구 캘린더</title>

<!-- PWA: 홈 화면에 추가(설치)를 지원하기 위한 매니페스트/아이콘/메타태그.
     manifest.json과 icons/는 index.html과 같은 저장소 루트에 있어야 하므로
     상대경로(리딩 슬래시 없이)로 참조한다 - GitHub Pages 서브패스(/09-calendar/)
     배포와도 호환됨. -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#5f0080" />
<link rel="icon" type="image/x-icon" href="icons/favicon.ico" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
<!-- iOS는 매니페스트의 display:standalone을 따르지 않아 이 메타태그들이 따로 필요하다. -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<!-- black-translucent는 설치 앱에서 콘텐츠를 상태바 밑으로 밀어넣고 시계를 흰 글씨로 그려
     노란 배너와 겹쳤다 - default로 두면 iOS가 상태바 영역을 따로 확보한다. -->
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Buyg" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

<!-- Google tag (gtag.js) - GA4 -->

<!-- Kakao JavaScript SDK (카카오톡 공유). 키(KAKAO_JAVASCRIPT_KEY)는 아래 스크립트 상단
     상수에 넣고, 공유 링크가 열릴 사이트 도메인을 카카오 개발자 콘솔 > 플랫폼 > Web에
     등록해야 실제 공유가 동작한다. 키가 비어 있으면 공유 버튼은 "준비 중" 안내만 띄운다. -->
<script async src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js" crossorigin="anonymous"></script>
<style>
  :root {
    --brand-purple: #5f0080;
    --brand-purple-dark: #43005c;
    --accent-lavender: #ede5f3;
    --accent-violet: #7b1fa2;
    --bg-light: #f8f9fa;
    --text-main: #1e293b;
    --text-sub: #94a3b8;
    --price-original: #adb5bd;
    --price-accent: #ff4b4b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; background: var(--bg-light); color: var(--text-main);
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  }
  /* 카드 안 상품명/가격 <a>가 기본 파란 하이퍼링크 색상+밑줄로 보이던 문제 제거 */
  a { color: inherit; text-decoration: none; }
  .app {
    max-width: 480px; margin: 0 auto; background: #fff; min-height: 100vh;
    box-shadow: 0 0 24px rgba(0,0,0,0.06);
    padding-bottom: 40px;
  }

  /* ---------------- 헤더 ---------------- */
  /* viewport-fit=cover 환경(아이폰 노치/다이내믹 아일랜드)에서 상태바 영역을 흰 띠로 덮어,
     스크롤되는 카드가 시계/배터리 밑으로 비치지 않게 한다. 인셋이 0인 기기에선 높이 0. */
  body::before {
    content: ''; position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    height: env(safe-area-inset-top, 0px); background: #fff; pointer-events: none;
  }
  .app-header {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: #fff;
    padding: 14px 16px 12px; border-bottom: 1px solid #f0f0f0;
  }
  [hidden] { display: none !important; }
  /* ---------------- 최상단 카카오톡 알림 유입 띠배너 ----------------
     375px에서 한 줄에 다 안 들어가는 문구라, 지저분하게 꺾이지 않도록 "안내 문구"와
     "입장 링크"를 각각 줄바꿈 불가(nowrap) 덩어리로 두고 좁으면 링크가 통째로 다음 줄로
     내려가게 했다(넓으면 한 줄). 우측 닫기 버튼 자리는 padding으로 확보. */
  .notice-bar {
    position: relative; background: #fee500; color: #3c1e1e;
    padding: 9px 40px 9px 14px; text-align: center; line-height: 1.45;
    padding-top: calc(9px + env(safe-area-inset-top, 0px));
    display: flex; flex-wrap: wrap; justify-content: center; align-items: center; column-gap: 8px;
  }
  /* 배너를 닫은 날엔 로고 영역이 맨 위가 되므로 거기에 상태바 인셋을 준다. */
  .notice-bar[hidden] + .brand-hero { padding-top: calc(18px + env(safe-area-inset-top, 0px)); }
  .notice-msg { font-size: 12.5px; font-weight: 700; white-space: nowrap; }
  .notice-cta {
    font-size: 12.5px; font-weight: 800; white-space: nowrap; color: #3c1e1e;
    text-decoration: underline; text-underline-offset: 2px; cursor: pointer;
  }
  .notice-close {
    /* 상단 인셋만큼 늘어난 padding의 절반을 더해, 배너 전체가 아닌 글자 줄 기준으로 세로 중앙 */
    position: absolute; right: 6px; top: calc(50% + env(safe-area-inset-top, 0px) / 2); transform: translateY(-50%);
    width: 28px; height: 28px; border: none; background: transparent; color: #3c1e1e;
    font-size: 15px; line-height: 1; cursor: pointer; border-radius: 50%; padding: 0;
  }
  .notice-close:hover { background: rgba(0,0,0,0.08); }

  /* ---------------- 토스트 / 공유 버튼 / 공유받은 공구 ---------------- */
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 12px);
    max-width: calc(100vw - 32px); padding: 10px 16px; border-radius: 999px;
    background: rgba(30,41,59,0.94); color: #fff; font-size: 13px; font-weight: 600;
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease; z-index: 100;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  /* ---- 찜하기 토스트: "찜 목록에 저장되었습니다!" + 캘린더 등록 버튼 ----
     일반 .toast(텍스트 한 줄, 짧게 스쳐가는 안내용)와 별도 엘리먼트로 둔다 -
     버튼이 있는 만큼 최소 노출 시간을 더 주고(자동 사라짐 3.5초) 닫기 버튼도
     둬야 해서 마크업/타이밍이 다르다. safe-area-inset으로 하단 홈 인디케이터에
     안 가리게 하고, z-index는 다른 플로팅 요소들보다 확실히 위에 오게 한다. */
  .fav-toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 16px);
    max-width: calc(100vw - 32px); width: 340px;
    padding: 12px 14px 12px 16px; border-radius: 14px;
    background: rgba(30,41,59,0.96); color: #fff; box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    opacity: 0; pointer-events: none; transition: opacity 0.22s ease, transform 0.22s ease;
    z-index: 200;
    padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  }
  .fav-toast.show { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
  .fav-toast-msg { font-size: 13px; font-weight: 700; white-space: nowrap; }
  .fav-toast-actions { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  .fav-toast-cal-btn {
    display: inline-block; font-size: 12px; font-weight: 700; color: #1e1b3a;
    background: #fff; padding: 7px 12px; border-radius: 999px; white-space: nowrap;
    text-decoration: none; cursor: pointer; transition: transform 0.12s ease;
  }
  .fav-toast-cal-btn:active { transform: scale(0.96); }
  .fav-toast-close {
    width: 24px; height: 24px; flex: 0 0 24px; border: none; background: rgba(255,255,255,0.14);
    color: #fff; border-radius: 50%; font-size: 12px; line-height: 1; cursor: pointer; padding: 0;
  }
  @media (max-width: 380px) {
    .fav-toast { flex-direction: column; align-items: stretch; }
    .fav-toast-actions { margin-left: 0; }
    .fav-toast-cal-btn { flex: 1; text-align: center; }
  }
  /* 카드 높이는 가격 문구 길이에 따라 제각각이라, 같은 줄의 카드끼리 텍스트 바닥선이
     들쭉날쭉하지 않도록 카드를 세로 flex로 만들고 마지막 텍스트 줄(가격, 없으면 상품명)을
     margin-top:auto로 맨 아래에 붙인다(가로 스크롤 줄/그리드 줄의 카드는 이미 같은
     높이로 늘어나 있다). 2026-09-23: 하단 카카오 공유 버튼을 없애고 썸네일 우상단
     찜 버튼 옆으로 옮기면서, 바닥 정렬을 그 버튼 대신 이 마지막 텍스트 줄이 맡게 됨. */
  .closing-card, .banner-card, .upcoming-card, .week-card { display: flex; flex-direction: column; }
  .week-card-body { flex: 1; display: flex; flex-direction: column; }
  .closing-card > :last-child, .banner-card > :last-child,
  .upcoming-card > :last-child, .week-card-body > :last-child { margin-top: auto; }
  #sharedSection { scroll-margin-top: 76px; } /* 상단 고정 검색창에 가려지지 않게 */
  #sharedSection .week-grid { grid-template-columns: 1fr; padding: 0 16px; }
  #sharedSection .week-card { max-width: 220px; }
  .shared-highlight { animation: sharedPulse 1.6s ease 2; }
  @keyframes sharedPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(254,229,0,0); }
    50% { box-shadow: 0 0 0 4px rgba(254,229,0,0.9); }
  }
  .shared-close { border: none; background: none; color: var(--text-sub); font-size: 12px; cursor: pointer; padding: 0; }

  /* 브랜드 소개 영역: 스크롤하면 위로 사라지고 검색창 헤더만 상단에 고정된다
     (카피가 늘어난 만큼 sticky 영역까지 커지면 모바일 화면을 너무 잡아먹음). */
  .brand-hero { padding: 18px 16px 4px; text-align: center; }
  .logo {
    display: inline-block; font-size: 24px; font-weight: 800; letter-spacing: 0.5px;
    color: var(--brand-purple); margin-bottom: 6px; text-decoration: none; cursor: pointer;
  }
  .brand-main {
    font-size: 14px; font-weight: 700; line-height: 1.4; color: var(--text-main);
    text-wrap: balance; word-break: keep-all;
  }
  .brand-sub { font-size: 12px; color: var(--text-sub); margin-top: 3px; word-break: keep-all; }
  .today-badge {
    display: inline-block; margin-top: 10px;
    padding: 5px 12px; border-radius: 999px; background: var(--accent-lavender);
    color: var(--brand-purple); font-size: 12px; font-weight: 700;
  }
  .today-badge b { font-size: 13px; font-weight: 800; }
  .search-box { position: relative; }
  #searchInput {
    width: 100%; padding: 11px 38px 11px 16px; font-size: 16px;
    border: none; border-radius: 22px; outline: none; background: var(--bg-light);
    -webkit-appearance: none; appearance: none;
  }
  #searchInput::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
  #searchInput::-ms-clear { display: none; }
  #searchInput:focus { box-shadow: 0 0 0 2px var(--accent-violet); }
  #clearSearch {
    display: none; position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    width: 26px; height: 26px; border: none; border-radius: 50%; background: #ddd; color: #666;
    font-size: 14px; line-height: 1; cursor: pointer; padding: 0;
  }
  #clearSearch.show { display: block; }
  .count { font-size: 12px; color: var(--text-sub); margin-top: 6px; min-height: 16px; padding: 0 2px; }

  /* ---------------- 공통 섹션 ---------------- */
  .section { padding: 20px 0 4px; }
  .section-head {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 0 16px; margin-bottom: 12px;
  }
  .section-head h2 { font-size: 16px; font-weight: 800; margin: 0; }
  .section-head .sub { font-size: 11px; color: var(--text-sub); }

  .hscroll {
    display: flex; gap: 10px; overflow-x: auto; -webkit-overflow-scrolling: touch;
    padding: 0 16px 6px; scroll-snap-type: x proximity; scrollbar-width: none;
  }
  .hscroll::-webkit-scrollbar { display: none; }

  /* ---- PC(마우스) 전용 가로 슬라이드 보조: 좌우 화살표 + 드래그 스크롤 ----
     터치스크린은 이미 스와이프가 되므로, 실제 마우스(hover 가능 + 포인터 정밀)
     환경에서만 화살표를 보이고 드래그 커서를 준다. */
  .hscroll-wrap { position: relative; }
  .scroll-arrow {
    display: none; position: absolute; top: 50%; transform: translateY(-50%);
    width: 32px; height: 32px; border-radius: 50%; border: none;
    background: rgba(255,255,255,0.92); box-shadow: 0 2px 8px rgba(0,0,0,0.18);
    color: var(--brand-purple); font-size: 18px; font-weight: 700; line-height: 1; cursor: pointer;
    align-items: center; justify-content: center; z-index: 5; padding: 0;
  }
  .scroll-arrow.arrow-left { left: 2px; }
  .scroll-arrow.arrow-right { right: 2px; }
  @media (hover: hover) and (pointer: fine) {
    .scroll-arrow { display: flex; }
    .hscroll, .day-bar { cursor: grab; }
    .hscroll.dragging, .day-bar.dragging { cursor: grabbing; user-select: none; scroll-snap-type: none; }
  }

  .thumb-wrap { position: relative; border-radius: 14px; overflow: hidden; background: var(--accent-lavender); }
  /* object-fit: cover였을 때 인스타 피드 안에 박혀 있는 문구(마감일/할인율 등)가
     이미지 잘림으로 함께 잘려나가는 문제가 있었다. contain으로 바꿔 이미지 전체를
     항상 보존하고, 원본 비율이 컨테이너와 달라 남는 여백은 배경색(라벤더)이
     자연스럽게 채운다 - 정사각 원본은 기존과 동일하게 꽉 차 보이고, 세로가 긴
     원본만 위아래 여백이 생긴다. */
  .thumb-wrap img { display: block; width: 100%; height: 100%; object-fit: contain; }
  .influencer-badge {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    max-width: 85%; z-index: 2;
    display: inline-flex; align-items: center; font-size: 10px; font-weight: 700;
    color: #fff; background: rgba(0,0,0,0.5); -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.25);
    padding: 3px 8px; border-radius: 999px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; cursor: pointer;
  }
  .search-card .influencer-badge { font-size: 9px; padding: 2px 6px; }

  /* ---- 상품명/가격 공통 타이포 (마감임박/이달의공구/이번주/검색 카드 공통 규격) ----
     29CM/올리브영류 커머스 앱 기준: 상품명 13~14px 2줄 말줄임, 정가는 취소선 보조
     정보로 작게, 공구가(최종가)만 굵고 크게 포인트 컬러로 강조한다. */
  .product-name {
    font-size: 13px; font-weight: 700; color: var(--text-main); line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    margin-top: 7px;
  }
  /* min-height: 가격 텍스트 길이가 카드마다 달라도(정가 유무, 대표가 추출 등)
     같은 가로 스크롤 줄 안에서 카드 높이가 들쭉날쭉해지지 않도록 한 줄 높이를
     최소로 고정한다. */
  .price-row { margin-top: 3px; display: flex; align-items: baseline; gap: 5px; flex-wrap: wrap; min-height: 19px; }
  .price-original { font-size: 11px; color: var(--price-original); text-decoration: line-through; font-weight: 500; }
  .price-final {
    font-size: 15px; font-weight: 700; color: var(--price-accent);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-all;
  }
  /* "10봉 구매시 6,990원(40g), 5봉 36,900원..." 같은 조건부 설명 문장은 순수
     가격이 아니라서 강조 빨간색 대신 차분한 톤으로, 대표가만 뽑아 짧게 보여준다. */
  .price-final.price-muted { font-size: 12px; font-weight: 600; color: var(--text-main); }
  /* 가격 정보가 없을 때: 더 이상 보라색 '단독특가' 류 뱃지로 강조하지 않고,
     차분한 안내 문구 한 줄로 자연스럽게 흡수한다 (시각 피로도 완화). */
  .price-plain { font-size: 11px; color: var(--text-sub); font-weight: 600; }

  /* ---- 마감임박 / 이달의 공구: 썸네일 비율·라운드·패딩 규격 통일 ----
     두 섹션 모두 정사각 썸네일 + 우상단 배지 1개 + 썸네일 아래 텍스트 블록의
     동일한 카드 골격을 쓴다(이전엔 이달의공구만 와이드 배너+이미지 위 흰 글자
     오버레이 형태라 마감임박과 규격이 달랐다). */
  .closing-card, .banner-card { flex: 0 0 132px; scroll-snap-align: start; }
  .closing-card .thumb-wrap, .banner-card .thumb-wrap { width: 132px; height: 132px; border-radius: 14px; }
  /* 우상단은 찜(하트) 버튼 자리라 D-day/마감 배지는 좌상단으로 옮겼다. */
  .closing-badge, .banner-badge {
    position: absolute; top: 6px; left: 6px;
    color: #fff; font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 8px;
  }

  /* ---- 찜(하트) + 공유 버튼: 썸네일 우상단에 나란히 ----

function priorityWeight(row) {

// 우선순위(가중치 높은 게 먼저) → 동순위 내에서는 날짜 기준(dateKeyFn, 작을수록 먼저)으로 정렬.
function sortWithPriority(list, dateKeyFn) {
  return list.slice().sort(function (a, b) {
    const pw = priorityWeight(b) - priorityWeight(a);
    if (pw !== 0) return pw;
    return dateKeyFn(a) - dateKeyFn(b);
  });
}

function sameCardGroup(a, b) {
  if (a.influencer_handle && a.influencer_handle === b.influencer_handle) return true;

// 다른 그룹의 첫 항목을 찾아 그 자리로 당겨와 흐름을 끊는다(그리디 방식 - 완벽한
// 전역 최적 분산은 아니지만 8~10개 안팎의 섹션 길이에서는 충분함).
function capConsecutiveRuns(list, maxRun) {
  const result = list.slice();
  for (let i = maxRun; i < result.length; i++) {
    let runIntact = true;
    for (let j = i - maxRun + 1; j <= i; j++) {
      if (!sameCardGroup(result[j - 1], result[j])) { runIntact = false; break; }
    }
    if (!runIntact) continue;
    let swapIdx = -1;
    for (let j = i + 1; j < result.length; j++) {
      if (!sameCardGroup(result[i - 1], result[j])) { swapIdx = j; break; }
    }
    if (swapIdx === -1) break; // 남은 항목이 전부 같은 그룹이면 더 손쓸 수 없다
    const item = result.splice(swapIdx, 1)[0];
    result.splice(i, 0, item);
  }
  return result;
}

  try { localStorage.setItem(FAV_STORAGE_KEY, JSON.stringify(Array.from(favSet))); } catch (e) {}
}
// row_id("row-N")는 매일 밤 재생성/날짜순 정렬되며 번호가 바뀌므로 식별자로 못
// 쓴다. 인플루언서 + (브랜드 || 상품명)으로 만들어 재빌드 후에도 같은 공구가
// 같은 키를 갖게 한다("외 N종" 접미사와 공백은 병합 상태에 따라 달라져 제거).
function favKey(row) {
  const name = (row.product_name || '').replace(/\s*외\s*\d+종$/, '').replace(/\s+/g, '');
  return (row.influencer_handle || row.influencer_name || '') + '|' + (row.brand || name);
}
function isFav(row) { return favSet.has(favKey(row)); }
function favCount() { return ROWS.filter(isFav).length; }

function syncFavBtn(btn) {
  const on = favSet.has(btn.dataset.favKey);
  btn.classList.toggle('on', on);
  btn.setAttribute('aria-pressed', on ? 'true' : 'false');
  btn.setAttribute('aria-label', on ? '찜 해제' : '찜하기');
}
function toggleFav(row, btn) {
  const key = favKey(row);
  const nowOn = !favSet.has(key);
  if (nowOn) favSet.add(key); else favSet.delete(key);
  saveFavs();
  // 같은 공구가 마감임박/이번주 등 여러 섹션에 동시에 떠 있을 수 있어 하트를 모두 동기화
  document.querySelectorAll('.fav-btn').forEach(function (b) {
    if (b.dataset.favKey === key) syncFavBtn(b);
  });
  btn.classList.remove('pop'); void btn.offsetWidth; btn.classList.add('pop');
  updateFavChipCount();
  if (activeChip === 'fav' && !nowOn) renderFavSection();
  // 찜을 "해제"할 때는 안 띄운다 - "저장됐다"는 안내가 방금 뺀 행동과 안 맞다.
  if (nowOn) showFavToast(row);
}
// 칩 줄 전체를 다시 그리면 가로 스크롤 위치가 초기화되므로 찜 탭의 개수만 갱신한다.
function updateFavChipCount() {
  const label = document.querySelector('.chip[data-chip-id="fav"] .chip-label');
  if (!label) return;
  const n = favCount();
  label.innerHTML = '찜한 공구' + (n ? ' <span class="chip-count">' + n + '</span>' : '');
}
// 카드 전체가 구매링크 <a>라 버튼을 중첩할 수 없어 influencer 배지와 같은 방식(<span>)을 쓴다.
function makeFavBtn(row) {
  const btn = document.createElement('span');
  btn.className = 'fav-btn';
  btn.setAttribute('role', 'button');
  btn.tabIndex = 0;
  btn.dataset.favKey = favKey(row);
  btn.innerHTML = HEART_SVG;
  syncFavBtn(btn);
  btn.addEventListener('click', function (e) {
    e.preventDefault();
    e.stopPropagation();
    toggleFav(row, btn);
  });
  btn.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      e.stopPropagation();
      toggleFav(row, btn);
    }
  });
  return btn;
}

// 카카오톡 공유 버튼. shareRow()는 이 파일 아래쪽에 정의돼 있지만 function 선언은
// 호이스팅되므로 순서 상관없이 호출 가능하다. 하트와 동일한 <span> 패턴.
function makeShareBtn(row) {
  const btn = document.createElement('span');
  btn.className = 'thumb-share-btn';
  btn.setAttribute('role', 'button');
  btn.setAttribute('aria-label', '카카오톡으로 공유');
  btn.title = '카카오톡으로 공유';
  btn.tabIndex = 0;
  btn.innerHTML = SHARE_ICON;
  btn.addEventListener('click', function (e) {
    e.preventDefault();
    e.stopPropagation();
    shareRow(row);
  });
  btn.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      e.stopPropagation();
      shareRow(row);
    }
  });
  return btn;
}

// ---------------- 토스트 ----------------
let toastTimer = null;
function showToast(msg, ms) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.classList.remove('show'); }, ms || 2200);
}

// ---------------- 찜하기 토스트: 저장 안내 + 캘린더 등록 ----------------
function addDaysIso(iso, days) {
  const d = parseDate(iso);
  if (!d) return iso;
  d.setDate(d.getDate() + days);
  return toLocalIso(d);
}
// 구글 캘린더 "일정 만들기" 템플릿 URL - 서버 없이 정적 사이트에서 새 탭으로 바로
// 열 수 있는 가장 간단한 방법(로그인돼 있으면 원클릭 저장, 앱이 깔려 있으면
// 모바일에서 앱으로 딥링크되는 경우도 많다). 하루짜리 종일 일정이라 dates는
// YYYYMMDD/YYYYMMDD(다음날, 배타적 종료) 형식을 쓴다.
function calendarUrlFor(row) {
  const deadline = row.end_date || row.start_date;
  if (!deadline) return '';
  const startYmd = deadline.replace(/-/g, '');
  const endYmd = addDaysIso(deadline, 1).replace(/-/g, '');
  const title = '[Buyg 공구 마감] ' + (row.product_name || '');
  const price = priceInfo(row).text;
  const lines = [row.date_label + ' 진행' + (row.influencer_label ? ' · ' + row.influencer_label : '')];
  if (price && price !== PRICE_UNKNOWN_TEXT) lines.push('가격: ' + price);
  if (row.post_url) lines.push('게시물: ' + row.post_url);
  const params = new URLSearchParams({
    action: 'TEMPLATE',
    text: title,
    dates: startYmd + '/' + endYmd,
    details: lines.join('\n'),
  });
  return 'https://calendar.google.com/calendar/render?' + params.toString();
}
let favToastTimer = null;
function hideFavToast() {
  document.getElementById('favToast').classList.remove('show');
  clearTimeout(favToastTimer);
}
function showFavToast(row) {
  const el = document.getElementById('favToast');
  const calBtn = document.getElementById('favToastCalBtn');
  const url = calendarUrlFor(row);
  // 마감일을 전혀 알 수 없는 극히 드문 행(시작일도 없음)이면 등록할 날짜가
  // 없으니 버튼을 숨긴다 - 안내 문구만 보여준다.
  calBtn.style.display = url ? '' : 'none';
  if (url) calBtn.href = url;
  document.getElementById('toast').classList.remove('show'); // 겹쳐 보이지 않게 일반 토스트는 내려둔다
  // PWA 설치 바텀시트와도 동시에 뜨면 겹치므로, 찜 토스트가 우선이면 시트는 내려둔다
  // (세션당 노출은 이미 한 번 했으니 다시 못 뜨는 것은 아니고, 다음 조건 재계산 때 다시 뜰 수 있음).
  const sheet = document.getElementById('installSheet');
  if (sheet) sheet.classList.remove('show');
  el.classList.add('show');
  clearTimeout(favToastTimer);
  favToastTimer = setTimeout(hideFavToast, 3500);
}

// ---------------- 카카오톡 공유 ----------------
const SHARE_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3C6.48 3 2 6.58 2 11c0 2.8 1.86 5.27 4.66 6.7l-.95 3.46a.4.4 0 0 0 .62.43L11.2 18.9c.27.02.53.03.8.03 5.52 0 10-3.58 10-8S17.52 3 12 3z"/></svg>';

// 공유 링크는 #deal=<찜 키> 형태의 해시. 열면 initSharedDeal()이 그 공구 카드를 페이지
// 맨 위 "공유받은 공구"에 띄우고 강조해서, 필터/날짜/더보기 상태와 무관하게 항상 보인다.
function shareUrlFor(row) {
  // 쿼리(?utm_…, ?fbclid=… 등 유입 파라미터)는 떼고 "사이트 주소#deal=키"만 공유 링크로 쓴다.
  return location.href.split('#')[0].split('?')[0] + '#deal=' + encodeURIComponent(favKey(row));
}
function shareDescription(row) {
  const info = priceInfo(row);
  // 금액이 있고 이미 "공구가/정가/최저..."로 시작하지 않을 때만 "공구가 "를 붙인다
  // (그대로 붙이면 "공구가 공구가 58,000원", "공구가 최대 21% 할인"처럼 어색해짐).
  const needsPrefix = /원/.test(info.text) && info.text.indexOf('→') === -1 && !/^(공구가|정가|정상가|최저)/.test(info.text);
  const first = info.cta
    ? (row.key_benefit || '가격은 링크에서 확인하세요')
    : (needsPrefix ? '공구가 ' + info.text : info.text);
  return (first + '\n' + row.date_label + ' 진행' + (row.influencer_label ? ' · ' + row.influencer_label : '')).slice(0, 200);
}
function shareRow(row) {
  if (!KAKAO_JAVASCRIPT_KEY) {
    console.log('[Buyg] KAKAO_JAVASCRIPT_KEY가 비어 있어 카카오톡 공유는 준비 중입니다.');
    showToast('카카오톡 공유 기능 준비 중이에요 🛠️');
    return;
  }
  if (!window.Kakao) {
    showToast('카카오 SDK를 불러오지 못했어요. 잠시 후 다시 시도해 주세요');
    return;
  }
  try {
    if (!Kakao.isInitialized()) Kakao.init(KAKAO_JAVASCRIPT_KEY);
    const url = shareUrlFor(row);
    // PC 카카오톡은 webUrl이 없으면 "모바일에서 확인해 주세요"로 링크를 비활성화한다. 본문 영역과
    // 버튼 양쪽 모두 webUrl + mobileWebUrl을 같은 타깃 URL로 빠짐없이 지정한다(객체는 각각 새로
    // 만들어 SDK가 내부에서 하나를 변형해도 다른 쪽에 영향이 없게 한다). 그래도 PC에서 막히면
    // 코드가 아니라 카카오 개발자 콘솔의 [제품 링크 관리]에 사이트 도메인이 등록됐는지 확인할 것.
    const contentLink = { webUrl: url, mobileWebUrl: url };
    const buttonLink = { webUrl: url, mobileWebUrl: url };
    Kakao.Share.sendDefault({
      objectType: 'feed',
      content: { title: row.product_name, description: shareDescription(row), imageUrl: row.image_url || '', link: contentLink },
      buttons: [{ title: '공구 보러가기', link: buttonLink }],
    });
  } catch (err) {
    console.log('[Buyg] 카카오톡 공유 실패', err);
    showToast('공유에 실패했어요. 잠시 후 다시 시도해 주세요');
  }
}
function initSharedDeal() {
  const m = location.hash.match(/^#deal=(.+)$/);
  if (!m) return;
  let key;
  try { key = decodeURIComponent(m[1]); } catch (e) { return; }
  const row = ROWS.find(function (r) { return favKey(r) === key; });
  if (!row) { showToast('공유받은 공구가 종료됐거나 찾을 수 없어요'); return; }
  const section = document.getElementById('sharedSection');
  const grid = document.getElementById('sharedGrid');
  grid.innerHTML = '';
  const card = renderWeekCard(row);
  card.classList.add('shared-highlight');
  grid.appendChild(card);
  section.hidden = false;
  // 페이지 로드 직후에는 브라우저의 해시 처리/스크롤 복원이 위치를 다시 덮어쓸 수 있어,
  // 즉시 + load 이후 + 짧은 지연 뒤에 한 번씩 더 맞춰준다.
  const go = function () { section.scrollIntoView({ block: 'start' }); };
  go();
  if (document.readyState !== 'complete') window.addEventListener('load', go, { once: true });
  setTimeout(go, 300);
}

function matchesChip(row, chip) {
  if (chip.fav) return isFav(row);
  if (!chip.keywords) return true;
  const hay = ((row.product_name || '') + ' ' + (row.brand || '') + ' ' + (row.key_benefit || '')).toLowerCase();
  return chip.keywords.some(function (kw) { return hay.indexOf(kw.toLowerCase()) !== -1; });
}

function placeholderDataUri(category) {
  const emoji = CATEGORY_EMOJI[category] || '🛍️';

    + '<text x="50%" y="52%" font-size="90" text-anchor="middle" dominant-baseline="middle">' + emoji + '</text>'
    + '</svg>';
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);

function makeThumb(row, className) {

  // (중첩 앵커는 무효한 HTML - 클릭 동작이 브라우저마다 달라짐). 대신 <span>에
  // 클릭 핸들러를 달아 이벤트 버블링만 막고 새 탭으로 직접 연다.

  }
  // 찜(하트)과 카카오톡 공유를 썸네일 우상단에 한 줄로 묶는다 - 공유가 왼쪽,
  // 찜이 오른쪽(엄지가 닿는 위치가 항상 같도록 찜을 바깥쪽에 고정).
  const actions = document.createElement('span');
  actions.className = 'thumb-actions';
  actions.appendChild(makeShareBtn(row));
  actions.appendChild(makeFavBtn(row));
  wrap.appendChild(actions);

function linkFor(row) {
  return row.purchase_url || row.influencer_profile_url || '#';
}

// '모음전'처럼 세부 품목별 가격이 "금전출납기 46,000원 / 캐시캣 19,800원 / ..."
// 식으로 슬래시 나열된 채 이미 DB에 저장돼 있는 경우(파서 프롬프트 개선 전 데이터
// 포함), 카드 한 줄에 다 안 들어가 지저분해 보이는 문제를 화면 표시 시점에
// 정리한다. "A원→B원" 할인 표기는 최종가 B만 남기고, 남은 모든 "N원" 값 중
// 최저가 하나만 "최저 N원 (외 M종)" 형태로 보여준다. 가격 신호가 하나뿐이거나
// 아예 없으면 원문 그대로 둔다(과도한 가공 방지).
function simplifyPrice(raw) {
  if (raw.indexOf('/') === -1) return raw;
  // '/'로 나뉜 세그먼트 = 실제 품목 경계이므로 세그먼트별로 "마지막에 언급된
  // 금액"만 그 품목의 최종가로 본다 (할인 표기 "1만원→7천원"의 최종가 7천원,
  // "26,900원+배송비3,000원=29,900원" 같은 합산식의 합계 29,900원이 항상
  // 마지막에 오므로 이 규칙 하나로 둘 다 맞는 값을 고른다 - 전체 문자열에서
  // 금액을 통으로 뽑으면 배송비 같은 부분 금액이 최저가로 잘못 뽑히는 문제가 있었음).
  const amounts = raw.split('/').map(function (seg) {
    // "정가 84,900원→7만원대"처럼 화살표 뒤가 '만원대' 등 비정확 표기라 숫자를 못
    // 뽑는 경우, 화살표 앞(할인 전 정가)을 최종가로 잘못 집으면 안 되므로 화살표
    // 뒤 텍스트만 본다 - 뒤에서 숫자를 못 찾으면 그 세그먼트는 통째로 버린다.
    const arrowIdx = seg.lastIndexOf('→');
    const relevant = arrowIdx !== -1 ? seg.slice(arrowIdx + 1) : seg;
    const matches = relevant.match(/[\d,]+(?=\s*원)/g);
    return matches ? parseInt(matches[matches.length - 1].replace(/,/g, ''), 10) : NaN;
  }).filter(function (n) { return !isNaN(n); });
  if (amounts.length < 2) return raw;
  const min = Math.min.apply(null, amounts);
  return '최저 ' + min.toLocaleString('ko-KR') + '원 (외 ' + (amounts.length - 1) + '종)';
}

// 가격 정보가 없을 때는 더 이상 마케팅 문구 뱃지로 꾸미지 않고, 차분한 안내
// 문구 한 줄로만 흡수한다 (카드마다 반복되던 보라색 '단독특가' 류 뱃지 제거).
const PRICE_UNKNOWN_TEXT = '가격은 링크에서 확인하세요';
// "10봉 구매 시 6,990원(40g), 5봉 36,900원, 10봉 69,900원" 처럼 구매조건이
// 섞인 문장은 순수 가격 표기가 아니다 - 카드에 그대로 넣으면 3~4줄로 넘쳐
// 레이아웃이 깨진다(2026-09-16 '목초우 소고기칩' 사고). 이런 문장인지 판별한다.
// 금액("원")이 2번 이상 나오거나, 짧은 가격 표기 치고 지나치게 길면(20자 초과)
// 조건 설명이 섞인 것으로 본다. simplifyPrice()가 이미 만든 "최저 N원 (외
// M종)" 요약문은 "원"이 1번뿐이라 여기 걸리지 않는다.
function isDescriptivePriceText(text) {
  const amountCount = (text.match(/[\d,]+\s*(?:만|천)?\s*원/g) || []).length;
  return amountCount >= 2 || text.length > 20;
}
function firstAmount(text) {
  // "7만원", "5천원"처럼 만/천 단위가 숫자와 원 사이에 끼는 한국어 표기도
  // 대표값으로 뽑는다 (숫자 바로 뒤에 원이 오는 경우만 잡던 이전 정규식은
  // 이런 표기를 놓쳐서 문장 전체가 그대로 노출됐었다).
  const m = text.match(/[\d,]+\s*(?:만|천)?\s*원/);
  return m ? m[0].replace(/\s+/g, '') : null;
}
function priceInfo(row) {
  const raw = simplifyPrice((row.price || '').trim());
  // "최저가"처럼 숫자 없이 단어 하나만 파싱된 경우도 실제 가격이 아니므로
  // 가격 미표기와 동일하게 다룬다(2026-09-16, bebe_loah '가베 맥타일즈' 사고).
  if (!raw || raw === '가격공개예정' || !/\d/.test(raw)) {
    return { text: PRICE_UNKNOWN_TEXT, cta: true, muted: false };
  }
  // 화살표(정가→공구가) 표기는 금액이 2번 나와도 깔끔한 형식이라 그대로 둔다
  // (아래 parsePriceParts가 정가/공구가 두 줄로 분리해서 보여준다).
  if (raw.indexOf('→') === -1 && isDescriptivePriceText(raw)) {
    const amt = firstAmount(raw);
    return { text: amt ? (amt + '~') : raw, cta: false, muted: true };
  }
  return { text: raw, cta: false, muted: false };
}
// "84,900원→7만원대"식 정가→공구가 표기만 정가(취소선)/공구가(강조) 두 줄로
// 분리한다. 화살표 뒤가 "7만원대" 같은 비정확 표기라 숫자를 못 뽑으면(정가와
// 나란히 비교할 신뢰도가 없으므로) 분리하지 않고 원문 그대로 한 줄만 보여준다.
function parsePriceParts(text) {
  const arrowIdx = text.lastIndexOf('→');
  if (arrowIdx === -1) return { original: null, final: text };
  const original = text.slice(0, arrowIdx).trim();
  const final = text.slice(arrowIdx + 1).trim();
  if (!/\d/.test(final)) return { original: null, final: text };
  return { original: original, final: final };
}
function renderPriceRow(row) {
  const info = priceInfo(row);
  const el = document.createElement('div');
  el.className = 'price-row';
  if (info.cta) {
    const plain = document.createElement('span');
    plain.className = 'price-plain';
    plain.textContent = info.text;
    el.appendChild(plain);
    return el;
  }
  const parts = parsePriceParts(info.text);
  if (parts.original) {
    const original = document.createElement('span');
    original.className = 'price-original';
    original.textContent = parts.original;
    el.appendChild(original);
  }
  const final = document.createElement('span');
  final.className = 'price-final' + (info.muted ? ' price-muted' : '');
  final.textContent = parts.final;
  el.appendChild(final);
  return el;
}
function makeNameEl(row) {
  const name = document.createElement('div');
  name.className = 'product-name';
  name.textContent = row.product_name;
  return name;
}

function parseDate(s) { return s ? new Date(s + 'T00:00:00') : null; }
function daysBetween(a, b) { return Math.round((a - b) / 86400000); }

function isActive(row) {
  const start = parseDate(row.start_date);
  const end = parseDate(row.end_date) || start;
  return start && start <= TODAY && TODAY <= end;
}
function isFuture(row) {
  const start = parseDate(row.start_date);
  return start && start > TODAY;
}

// ---------------- 홈 3단 구성: 마감임박 → 이번 주 → 곧 오픈 (상호배제 워터폴) ----------------
// 위쪽 섹션에 노출된 공구는 row.row_id를 usedIds Set에 쌓아 아래쪽 섹션에서 완전히
// 제외한다. row_id는 매일 밤 재생성되는 배열 인덱스("row-N")라 여러 날에 걸친 식별에는
// 못 쓰지만(찜하기가 favKey를 쓰는 이유), 이번엔 "이 페이지 로드 한 번" 안에서만
// 구분하면 되므로 오히려 더 정확하다 - favKey는 '인플루언서+브랜드' 단위라 서로 다른
// 실제 카드가 같은 키를 가질 수 있어(무관한 카드를 잘못 제외하는 사고가 실측 중
// 발견됨) 이 용도엔 안 맞았다. renderHome()이 세 함수를 이 순서 그대로 호출한다.

// ---------------- 1단: 마감 임박 (D-Day, D-1만) ----------------
function renderClosingSoon(rows, usedIds) {
  const list = rows.filter(function (r) {
    const end = parseDate(r.end_date) || parseDate(r.start_date);
    if (!end || end < TODAY) return false;
    return daysBetween(end, TODAY) <= 1; // 오늘(D-Day)·내일(D-1) 마감만
  }).sort(function (a, b) {
    return (parseDate(a.end_date) || parseDate(a.start_date)) - (parseDate(b.end_date) || parseDate(b.start_date));
  }).slice(0, 6);

  // 섹션 간 중복 제거는 row_id를 쓴다(favKey가 아님) - favKey는 '인플루언서+브랜드'
  // 단위라 서로 다른 실제 카드가 같은 키를 가질 수 있어(찜하기엔 맞는 근사치지만
  // 이번엔 틀림) 무관한 카드를 잘못 제외하는 사고가 실측 중 발견됐다. row_id는
  // 이 페이지 로드 한 번 안에서 배열 인덱스로 배정돼 항상 고유하므로 안전하다.
  list.forEach(function (row) { usedIds.add(row.row_id); });

  const el = document.getElementById('closingSoonList');
  el.innerHTML = '';
  if (!list.length) {
    el.innerHTML = '<div class="empty-note">오늘 마감 임박한 공구가 없어요.</div>';
    return;
  }
  list.forEach(function (row) {
    const end = parseDate(row.end_date) || parseDate(row.start_date);
    const dleft = Math.max(0, daysBetween(end, TODAY));
    const a = document.createElement('a');
    a.className = 'closing-card';
    a.href = linkFor(row); a.target = '_blank'; a.rel = 'noopener';
    const thumb = makeThumb(row);
    const badge = document.createElement('span');
    badge.className = 'closing-badge';
    badge.textContent = dleft === 0 ? '오늘마감' : ('D-' + dleft);
    thumb.appendChild(badge);
    a.appendChild(thumb);
    a.appendChild(makeNameEl(row));
    a.appendChild(renderPriceRow(row));
    el.appendChild(a);
  });
}

// ---------------- 3단: 곧 오픈하는 공구 (구 '이달의 공구' 슬롯 재사용, 역할을
// "진행중" -> "오픈예정(D-1~D-14)"으로 변경 - 기존 별도 '진행 예정' 섹션을 흡수해
// 없앴다) ----------------
// 카드 골격(정사각 썸네일 + 배지 + 가격)은 그대로 두고 필터/배지 문구만 바꾼다.
function renderSoonOpening(rows, usedIds) {
  let list = rows.filter(function (r) { return !usedIds.has(r.row_id) && isFuture(r); });
  list = sortWithPriority(list, function (r) { return parseDate(r.start_date); });
  list = capConsecutiveRuns(list, 2).slice(0, 8);
  list.forEach(function (row) { usedIds.add(row.row_id); });

  const el = document.getElementById('soonOpeningList');
  el.innerHTML = '';
  if (!list.length) {
    el.innerHTML = '<div class="empty-note">곧 오픈 예정인 공구가 아직 없어요.</div>';
    return;
  }
  list.forEach(function (row) {
    const start = parseDate(row.start_date);
    const d = daysBetween(start, TODAY);
    const mmdd = (start.getMonth() + 1) + '/' + start.getDate();

    const a = document.createElement('a');
    a.className = 'banner-card';
    a.href = linkFor(row); a.target = '_blank'; a.rel = 'noopener';
    const thumb = makeThumb(row);
    const badge = document.createElement('span');
    badge.className = 'banner-badge';
    badge.textContent = d <= 0 ? '오늘 오픈' : ('D-' + d + ' ' + mmdd + ' 오픈');
    thumb.appendChild(badge);
    a.appendChild(thumb);
    a.appendChild(makeNameEl(row));
    a.appendChild(renderPriceRow(row));
    el.appendChild(a);
  });
}

// ---------------- 카테고리 칩 ----------------
let activeChip = 'all';
function renderChips() {
  const el = document.getElementById('chipRow');
  el.innerHTML = '';
  CHIPS.forEach(function (chip) {
    const div = document.createElement('div');
    div.className = 'chip' + (chip.id === activeChip ? ' active' : '');
    div.dataset.chipId = chip.id;
    const count = chip.fav ? favCount() : 0;
    div.innerHTML = '<div class="chip-icon">' + chip.icon + '</div><div class="chip-label">' + chip.label
      + (count ? ' <span class="chip-count">' + count + '</span>' : '') + '</div>';
    div.addEventListener('click', function () {
      activeChip = chip.id;
      weekGridVisible = WEEK_GRID_PAGE_SIZE; // 카테고리를 바꾸면 다시 상위 8개만
      renderChips();
      renderHome();
    });
    el.appendChild(div);
  });
}

// ---------------- 2단: 이번 주 공구 (오늘부터 롤링 요일 바 + 2열 그리드) ----------------
let selectedDayIso = TODAY_ISO;
const WEEK_GRID_PAGE_SIZE = 8;
let weekGridVisible = WEEK_GRID_PAGE_SIZE; // 날짜/카테고리 바뀌면 8개로 리셋
// renderHome()이 1단(마감임박) 렌더 직후 채워주는 excludeIds(1단 결과만 담김)를
// day-bar 재클릭/더보기 클릭 시에도 그대로 재사용한다(1단은 날짜 이동으로 안 바뀌니
// 재계산 불필요). weekShownIds는 '오늘' 뷰에서 2단이 실제로 보여준 전체 후보(더보기로
// 펼쳐야 보이는 것 포함) - 3단이 이 값까지 합쳐서 제외에 쓴다.
let homeUsedIds = new Set();
let weekShownIds = new Set();

function renderDayBar() {
  const el = document.getElementById('dayBar');
  el.innerHTML = '';
  for (let i = 0; i < 14; i++) {
    const d = new Date(TODAY.getTime() + i * 86400000);
    const iso = toLocalIso(d);
    const pill = document.createElement('div');
    pill.className = 'day-pill' + (i === 0 ? ' today' : '') + (iso === selectedDayIso ? ' active' : '');
    pill.textContent = i === 0 ? ('오늘(' + d.getDate() + ')') : (d.getDate() + '(' + WEEKDAY_KR[d.getDay()] + ')');
    pill.addEventListener('click', function () {
      selectedDayIso = iso;
      weekGridVisible = WEEK_GRID_PAGE_SIZE; // 날짜를 바꾸면 다시 상위 8개만
      renderDayBar();
      renderWeekGrid(currentFilteredRows(), homeUsedIds);
    });
    el.appendChild(pill);
  }
}

function renderWeekCard(row) {
  const a = document.createElement('a');
  a.className = 'week-card';
  a.href = linkFor(row); a.target = '_blank'; a.rel = 'noopener';
  a.appendChild(makeThumb(row));
  const body = document.createElement('div'); body.className = 'week-card-body';
  const date = document.createElement('div'); date.className = 'week-card-date'; date.textContent = row.date_label;
  body.appendChild(date);
  body.appendChild(makeNameEl(row));
  body.appendChild(renderPriceRow(row));
  a.appendChild(body);
  return a;
}

function renderWeekGrid(rows, excludeIds) {
  const el = document.getElementById('weekGrid');
  el.innerHTML = '';
  let list = rows.filter(function (r) {
    if (excludeIds.has(r.row_id)) return false; // 1단(마감임박)에 이미 나온 건 제외
    const start = r.start_date, end = r.end_date || r.start_date;
    return start <= selectedDayIso && selectedDayIso <= end;
  });
  list = sortWithPriority(list, function (r) { return parseDate(r.end_date || r.start_date); });
  list = capConsecutiveRuns(list, 2);
  // '오늘' 뷰(기본 화면)에서 후보가 된 전체 목록을 weekShownIds에 따로 기록해둔다
  // (3단이 나중에 이 값까지 합쳐서 제외에 쓴다). excludeIds에 직접 더하면 안 되는
  // 이유: excludeIds는 day-bar/더보기가 이 함수를 다시 부를 때도 그대로 재사용되는데,
  // 방금 보여준 항목을 자기 자신의 exclude 목록에 넣어버리면 재호출 시 스스로를
  // 걸러내 리스트가 통째로 비어버리는 자기참조 버그가 생긴다(실측 중 발견).
  if (selectedDayIso === TODAY_ISO) {
    weekShownIds = new Set(list.map(function (r) { return r.row_id; }));
  }

  if (!list.length) {
    el.innerHTML = '<div class="empty-note">이 날짜엔 진행중인 공구가 없어요.</div>';
    return;
  }

  const shown = Math.min(weekGridVisible, list.length);
  list.slice(0, shown).forEach(function (row) { el.appendChild(renderWeekCard(row)); });

  const remaining = list.length - shown;
  if (remaining > 0) {
    const moreBtn = document.createElement('button');
    moreBtn.type = 'button';
    moreBtn.className = 'week-more-btn';
    moreBtn.textContent = '+ 더보기 (' + remaining + '건)';
    moreBtn.addEventListener('click', function () {
      const prevShown = shown;
      weekGridVisible = list.length; // 한 번에 나머지 전부 펼침
      renderWeekGrid(currentFilteredRows(), excludeIds);
      // 방금 새로 나타난 카드에만 페이드인 애니메이션을 준다.
      const cards = document.querySelectorAll('#weekGrid .week-card');
      for (let i = prevShown; i < cards.length; i++) { cards[i].classList.add('reveal'); }
    });
    el.appendChild(moreBtn);
  }
}

function currentFilteredRows() {
  const chip = CHIPS.find(function (c) { return c.id === activeChip; });
  return ROWS.filter(function (r) { return matchesChip(r, chip); });
}

// ---------------- 찜한 공구 탭: 홈 섹션 대신 찜한 카드만 2열 그리드로 ----------------
function renderFavSection() {
  const grid = document.getElementById('favGrid');
  const sub = document.getElementById('favSub');
  grid.innerHTML = '';
  const list = ROWS.filter(isFav).sort(function (a, b) {
    return (a.end_date || a.start_date || '').localeCompare(b.end_date || b.start_date || '');
  });
  sub.textContent = list.length ? (list.length + '개 · 마감 빠른 순') : '';
  if (!list.length) {
    grid.innerHTML = '<div class="fav-empty"><b>아직 찜한 공구가 없어요</b><span>마음에 드는 카드 우측 상단의 ♡를 눌러 담아보세요.</span></div>';
    return;
  }
  list.forEach(function (row) { grid.appendChild(renderWeekCard(row)); });
}

function renderTodayBadge() {
  const n = ROWS.filter(isActive).length;
  const el = document.getElementById('todayBadge');
  if (!n) { el.hidden = true; return; }
  el.innerHTML = '🔥 오늘 진행 중인 공구 <b>' + n + '</b>개';
  el.hidden = false;
}

function renderHome() {
  const isFavTab = activeChip === 'fav';
  document.getElementById('favSection').hidden = !isFavTab;
  document.getElementById('regularSections').hidden = isFavTab;
  if (isFavTab) { renderFavSection(); return; }
  const filtered = currentFilteredRows();
  // 1 -> 2 -> 3 순서로 상호배제(워터폴)한다. homeUsedIds는 1단 결과만 담아 2단에
  // 넘기고(day-bar/더보기가 나중에 이 함수를 다시 불러도 자기참조가 안 생기게),
  // 2단이 '오늘' 뷰에서 실제로 보여준 전체 후보(weekShownIds)는 3단에만 추가로 합친다.
  homeUsedIds = new Set();
  weekShownIds = new Set();
  renderClosingSoon(filtered, homeUsedIds);
  renderWeekGrid(filtered, homeUsedIds);
  const soonExcludeIds = new Set(homeUsedIds);
  weekShownIds.forEach(function (k) { soonExcludeIds.add(k); });
  renderSoonOpening(filtered, soonExcludeIds);
}

// ---------------- 검색 (플랫 리스트, 홈 섹션은 통째로 숨김) ----------------
const searchInput = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearSearch');
const homeSections = document.getElementById('homeSections');
const searchResultsEl = document.getElementById('searchResults');
const noResultsEl = document.getElementById('noResults');

function searchText(row) {
  // 제목/브랜드/카테고리뿐 아니라, 이 공구가 매칭되는 카테고리칩의 "라벨"도 검색
  // 대상에 포함시켜 "교구/완구"처럼 넓은 분류명으로도 찾을 수 있게 한다. 칩의
  // 키워드 전체를 넣지 않는 이유: 칩은 여러 키워드 중 하나만 맞아도 매칭되는
  // 느슨한 묶음이라(예: '이유식'으로 매칭된 행에 같은 칩의 다른 키워드를 전부
  // 붙이면 무관한 검색어에도 걸리는 오탐이 생긴다), 라벨 하나만 더하는 것이 안전하다.
  //
  // 인플루언서 검색: influencer_label('또니맘 (seohui_jeong)' / '@suksuk_mom_')만으로도
  // 닉네임+핸들이 대부분 커버되지만, 원본 influencer_name(가공 전 표기)도 함께 넣어
  // 라벨 조합 형식이 바뀌거나 예외 케이스가 있어도 "심플리홈"/"juney.s2"/"@juney.s2"
  // 어떤 식으로 검색해도 그 인플루언서의 공구가 전부 모여 나오게 한다. influencer_nickname은
  // hashtag/curator로 발굴돼 influencer_name에 핸들만 있는 계정(예: hayun.mom_)의 실제
  // 인스타 프로필 닉네임('하윤맘')을 매일 밤 bio_text에서 뽑아 채운 값 - 없으면 빈 문자열.
  const chipTerms = CHIPS.reduce(function (acc, chip) {
    if (chip.keywords && matchesChip(row, chip)) acc.push(chip.label);
    return acc;
  }, []);
  return [row.product_name, row.brand, row.influencer_label, row.influencer_name, row.influencer_nickname, row.category, row.key_benefit]
    .concat(chipTerms)
    .join(' ').toLowerCase();
}

function rowMatchesQuery(row, tokens) {
  const hay = searchText(row);
  return tokens.every(function (t) { return hay.indexOf(t) !== -1; });
}

function renderSearchResults(q) {
  // 인플루언서 핸들 검색 시 "@juney.s2"처럼 @를 붙여 입력하는 경우가 흔한데,
  // influencer_label은 닉네임이 있으면 '또니맘 (seohui_jeong)' 형식이라 '@'가
  // 없어 매칭이 안 됐다 - 검색어 쪽 선행 '@'를 지워 있어도/없어도 같게 만든다.
  const tokens = q.split(/\s+/).filter(Boolean).map(function (t) { return t.replace(/^@/, ''); });
  const matches = ROWS.filter(function (r) { return rowMatchesQuery(r, tokens); });
  searchResultsEl.innerHTML = '';
  noResultsEl.style.display = matches.length ? 'none' : 'block';
  matches.forEach(function (row) {
    const a = document.createElement('a');
    a.className = 'search-card';
    a.href = linkFor(row); a.target = '_blank'; a.rel = 'noopener';
    a.appendChild(makeThumb(row));
    const body = document.createElement('div'); body.className = 'search-card-body';
    body.appendChild(makeNameEl(row));
    const meta = document.createElement('div'); meta.className = 'search-card-meta';
    meta.textContent = row.date_label + ' · ' + row.influencer_label;
    body.appendChild(meta);
    body.appendChild(renderPriceRow(row));
    a.appendChild(body);
    searchResultsEl.appendChild(a);
  });
  document.getElementById('resultCount').textContent = '검색 결과: ' + matches.length + '건';
  return matches.length;
}

function filterRows() {
  const q = searchInput.value.trim().toLowerCase();
  clearBtn.classList.toggle('show', q.length > 0);

  if (q) {
    homeSections.style.display = 'none';
    searchResultsEl.style.display = 'block';
    renderSearchResults(q);
  } else {
    homeSections.style.display = '';
    searchResultsEl.style.display = 'none';
    noResultsEl.style.display = 'none';
    document.getElementById('resultCount').textContent = '';
  }
}

searchInput.addEventListener('input', filterRows);
searchInput.addEventListener('search', filterRows);
clearBtn.addEventListener('click', function () {
  searchInput.value = '';
  filterRows();
  searchInput.focus();
});

// 'Buyg' 로고를 홈으로 가는 링크로 만든다. 실제 href="./"를 두어(같은 페이지) 우클릭
// "새 탭에서 열기"/Ctrl+클릭이 정상 동작하게 하면서도, 평범한 좌클릭은 새로고침 없이
// 검색어 초기화 + 맨 위로 스크롤만 해서 더 매끄럽게 "홈"으로 돌아가게 한다.
document.getElementById('homeLink').addEventListener('click', function (e) {
  if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  e.preventDefault();
  searchInput.value = '';
  filterRows();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

// ---------------- PC 마우스 전용: 화살표 클릭 스크롤 + 드래그 스크롤 ----------------
// 터치는 이미 네이티브 스와이프가 되므로 여기서는 손대지 않는다. 컨테이너 자체는
// 재렌더링돼도 안 바뀌므로(innerHTML만 갈아끼움) 페이지 로드 시 한 번만 걸어두면 된다.
function enableDragScroll(el) {
  let isDown = false, startX = 0, startScrollLeft = 0, moved = false;

  el.addEventListener('mousedown', function (e) {
    isDown = true; moved = false;
    el.classList.add('dragging');
    startX = e.pageX;
    startScrollLeft = el.scrollLeft;
  });

  window.addEventListener('mouseup', function () {
    if (!isDown) return;
    isDown = false;
    el.classList.remove('dragging');
  });

  el.addEventListener('mouseleave', function () {
    if (isDown) { isDown = false; el.classList.remove('dragging'); }
  });

  el.addEventListener('mousemove', function (e) {
    if (!isDown) return;
    e.preventDefault();
    const dx = e.pageX - startX;
    if (Math.abs(dx) > 3) moved = true;
    el.scrollLeft = startScrollLeft - dx;
  });

  // 드래그를 링크 클릭으로 오인해 엉뚱한 게시물로 이동하지 않도록, 실제로
  // 끌었을 때만 클릭을 막는다 (제자리 클릭은 정상적으로 링크 이동).
  el.addEventListener('click', function (e) {
    if (moved) { e.preventDefault(); e.stopPropagation(); moved = false; }
  }, true);
}

function scrollArrowClick(targetId, dir) {
  const el = document.getElementById(targetId);
  if (!el) return;
  const amount = Math.round(el.clientWidth * 0.8) * dir;
  el.scrollBy({ left: amount, behavior: 'smooth' });
}

function setupSliders() {
  ['closingSoonList', 'dayBar', 'soonOpeningList'].forEach(function (id) {
    const el = document.getElementById(id);
    if (el) enableDragScroll(el);
  });
  document.querySelectorAll('.scroll-arrow').forEach(function (btn) {
    const targetId = btn.getAttribute('data-target');
    const dir = btn.classList.contains('arrow-left') ? -1 : 1;
    btn.addEventListener('click', function () { scrollArrowClick(targetId, dir); });
  });
}

// ---------------- PWA 홈 화면 추가 안내 (스마트 바텀시트) ----------------
// 노출 조건: (찜 1회 이상 했음) 또는 (이번이 2회차 이상 방문) - 첫 방문에 바로
// 뜨면 서비스를 알기도 전에 설치를 강요하는 느낌이라 배제한다. 데스크톱에서는
// "모바일 편의 기능"이라는 취지에 안 맞아 아예 노출하지 않는다.
const INSTALL_VISITS_KEY = 'buyg_visit_count';
const INSTALL_DISMISS_KEY = 'buyg_install_sheet_dismiss_until';
const INSTALL_SNOOZE_DAYS = 14; // 닫으면 이 기간 동안 다시 안 뜸("일정 기간 노출 차단")

function isStandaloneDisplay() {
  try {
    return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  } catch (e) { return false; }
}
function isMobileDevice() {
  return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || '');
}
function isIOSDevice() {
  const ua = navigator.userAgent || '';
  // iPadOS 13+는 데스크톱 Safari로 위장(UA에 iPad가 안 남고 MacIntel로 잡힘)하므로
  // 터치포인트로 한 번 더 구분한다.
  return /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}
function bumpInstallVisitCount() {
  let n = 0;
  try { n = parseInt(localStorage.getItem(INSTALL_VISITS_KEY) || '0', 10) || 0; } catch (e) {}
  n += 1;
  try { localStorage.setItem(INSTALL_VISITS_KEY, String(n)); } catch (e) {}
  return n;
}
function installSheetEligible() {
  if (!isMobileDevice() || isStandaloneDisplay()) return false;
  let dismissUntil = 0;
  try { dismissUntil = parseInt(localStorage.getItem(INSTALL_DISMISS_KEY) || '0', 10) || 0; } catch (e) {}
  if (Date.now() < dismissUntil) return false;
  const visits = bumpInstallVisitCount(); // 조건 계산 자체가 "이번 방문 카운트"라 한 번만 호출
  return favSet.size > 0 || visits >= 2;
}
function dismissInstallSheet() {
  document.getElementById('installSheet').classList.remove('show');
  try { localStorage.setItem(INSTALL_DISMISS_KEY, String(Date.now() + INSTALL_SNOOZE_DAYS * 86400000)); } catch (e) {}
}

let deferredInstallPrompt = null; // Android/Chrome의 beforeinstallprompt 이벤트 객체 보관
let installSheetShown = false; // 한 페이지 로드에서 두 번 뜨지 않게(중복 트리거 방지)

function renderInstallSheetContent(platform) {
  const desc = document.getElementById('installSheetDesc');
  const cta = document.getElementById('installSheetCta');
  const steps = document.getElementById('installSheetSteps');
  if (platform === 'android') {
    desc.textContent = '앱처럼 한 번에 열어보고, 새 공구 소식도 놓치지 마세요.';
    cta.style.display = 'block';
    steps.style.display = 'none';
  } else {
    desc.textContent = '아래 단계로 홈 화면에 추가하면 앱처럼 바로 열 수 있어요.';
    cta.style.display = 'none';
    steps.style.display = 'flex';
    // 사파리 실제 공유 버튼(SF Symbol "square.and.arrow.up" - 위가 뚫린 네모 상자 +
    // 위로 뻗는 화살표) 모양을 흉내낸 인라인 SVG. 이모지(⬆️)는 실제 버튼과 생김새가
    // 달라 "저게 그건가?" 하는 혼동을 줬는데, 이 모양이면 화면에서 바로 알아본다.
    const IOS_SHARE_SVG =
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
      'stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/>' +
      '<path d="M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>';
    steps.innerHTML =
      '<div class="install-sheet-step"><span class="install-sheet-step-num">1</span>' +
      '<span class="install-sheet-step-icon ios-share">' + IOS_SHARE_SVG + '</span>' +
      '<span>하단 <b>공유</b> 버튼을 탭하세요</span></div>' +
      '<div class="install-sheet-step"><span class="install-sheet-step-num">2</span>' +
      '<span class="install-sheet-step-icon">➕</span><span>목록에서 <b>홈 화면에 추가</b>를 선택하세요</span></div>';
  }
}

function openInstallSheet(platform) {
  if (installSheetShown) return;
  installSheetShown = true;
  renderInstallSheetContent(platform);
  const el = document.getElementById('installSheet');
  requestAnimationFrame(function () { el.classList.add('show'); });
}

function initInstallSheet() {
  const eligible = installSheetEligible(); // 방문 카운트 증가를 위해 always 호출(한 번만)
  document.getElementById('installSheetClose').addEventListener('click', dismissInstallSheet);
  document.getElementById('installSheetCta').addEventListener('click', function () {
    if (!deferredInstallPrompt) return;
    const p = deferredInstallPrompt;
    deferredInstallPrompt = null;
    p.prompt();
    p.userChoice.finally(dismissInstallSheet);
  });
  window.addEventListener('appinstalled', dismissInstallSheet);

  if (!eligible) return;

  // 안드로이드/크롬 계열: 브라우저가 설치 가능하다고 판단하면 이 이벤트를 준다 -
  // 이게 와야만 "1초 만에 바로 추가" 버튼이 실제로 동작하므로, 못 받으면 아예 안 띄운다.
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredInstallPrompt = e;
    if (!isIOSDevice()) openInstallSheet('android');
  });

  // iOS Safari는 beforeinstallprompt 자체가 없으므로 조건 충족 시 바로 안내를 띄운다.
  if (isIOSDevice()) openInstallSheet('ios');
}

renderTodayBadge();
renderChips();
renderDayBar();
renderHome();
setupSliders();
initInstallSheet();
initNoticeBar();
document.getElementById('sharedClose').addEventListener('click', function () {
  document.getElementById('sharedSection').hidden = true;
});
initSharedDeal();
window.addEventListener('hashchange', initSharedDeal);

// ---------------- 서비스 워커 등록 (PWA 설치 가능 판정용, 오프라인 캐싱 없음) ----------------
// 경로를 'sw.js'(상대경로)로 두는 이유는 manifest.json/icons와 동일 - GitHub Pages
// 서브패스(https://buyg-kids.github.io/09-calendar/) 배포에서도, 로컬에서
// python -m http.server로 루트 테스트할 때도 현재 페이지 기준으로 알아서
// 올바른 위치를 가리킨다(하드코딩된 절대경로 '/09-calendar/sw.js'는 로컬 테스트나
// 저장소/도메인 경로가 바뀌면 깨진다). 페이지 핵심 리소스 로딩과 경합하지 않게
// window 'load' 이후에 등록한다.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function (err) {
      console.log('[Buyg] 서비스 워커 등록 실패 - 설치 안내 기능 자체엔 영향 없음:', err);
    });
  });
}
