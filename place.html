<style>
  :root { --brand: #5f0080; --ink: #1f2430; --sub: #667085; --mute: #98a2b3; --line: #eceef3; --bg: #f7f8fa; --card: #fff;
          --ok-bg: #e9f6ef; --ok: #1b7a46; --warn-bg: #fff3e0; --warn: #a15c00; --unk-bg: #f1f3f7; --unk: #667085; --blue-bg: #e8f0ff; --blue: #1d4ed8; --bar-h: 76px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; -webkit-text-size-adjust: 100%; }

  .rbtn { display: block; margin: 12px 0 8px; padding: 13px; border-radius: 12px; background: var(--blue); color: #fff; font-size: 15px; font-weight: 800; text-align: center; text-decoration: none; }
  .tlink { display: inline-block; margin: 10px 0 4px; font-size: 13px; font-weight: 700; color: var(--brand); text-decoration: underline; text-underline-offset: 2px; }
  .eatcard { margin: 0 0 14px; padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: #fff; }
  .eatcard:last-of-type { margin-bottom: 8px; }

  .eatcard .blk.good { border-left-color: #2fa36b; } .eatcard .blk.bad { border-left-color: #e66f95; }
  .eatcard .blk h4 { margin: 0 0 4px; font-size: 12.5px; font-weight: 800; } .eatcard .blk.good h4 { color: #1b7a46; } .eatcard .blk.bad h4 { color: #c4375f; }
  .eatcard .blk ul { margin: 0; padding: 0 0 0 16px; } .eatcard .blk li { margin: 0 0 4px; font-size: 13.5px; line-height: 1.5; word-break: keep-all; }
  .eatcard .unkrow { display: flex; align-items: center; gap: 8px; margin: 10px 0 0; padding: 9px 11px; border: 1px dashed #d5dae3; border-radius: 10px; background: #f7f8fa; }
  .eatcard .unkrow .ut { font-size: 12.5px; color: var(--sub); line-height: 1.45; }
  .eatcard .foot { margin: 12px 0 0; font-size: 11.5px; color: #a3a9b4; line-height: 1.5; word-break: keep-all; }
  .eatcard .acts { display: flex; gap: 8px; margin-top: 12px; }
  .eatcard .acts a, .eatcard .acts button { flex: 1; min-height: 42px; border: 1.5px solid #dfe3ea; border-radius: 10px; background: #fff; font-size: 13px; font-weight: 800; color: var(--ink); text-decoration: none; display: flex; align-items: center; justify-content: center; cursor: pointer; font-family: inherit; }
  .eatcard .acts button.on { border-color: var(--brand); background: #f6ecfa; color: var(--brand); }
  .plancta { margin: 10px 0 0; padding: 14px 18px; background: #fff; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .plancta p { margin: 0; font-size: 13.5px; line-height: 1.45; color: var(--sub); } .plancta p b { display: block; color: var(--ink); font-size: 14.5px; }
  .plancta a { flex: 0 0 auto; padding: 11px 14px; border-radius: 10px; background: var(--brand); color: #fff; font-size: 13.5px; font-weight: 800; text-decoration: none; }

  section.mod { margin: 10px 0 0; padding: 18px; background: var(--card); }
  section.mod > h2 { margin: 0 0 12px; font-size: 16px; font-weight: 800; letter-spacing: -.01em; padding-left: 9px; border-left: 3px solid var(--brand); line-height: 1.2; }

  .gauge { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; height: 10px; }
  .gauge i { background: #e6e8ee; border-radius: 4px; } .gauge i.on { background: var(--brand); }
  .agebar .lv { font-size: 12px; font-weight: 700; color: var(--sub); text-align: right; }
  .agenote { margin: 10px 0 0; padding: 10px 12px; border-radius: 10px; background: #f6f0fa; font-size: 12.5px; line-height: 1.5; color: #4a2b5c; }
  .agecap { margin: 8px 0 0; font-size: 11.5px; color: var(--mute); }
  .infra { display: grid; gap: 10px; }
  .icard { padding: 13px 14px; border: 1px solid var(--line); border-radius: 14px; background: #fff; }
  .icard.unk { background: #f7f8fa; border-style: dashed; }
  .icard .ih { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; }
  .icard .ih b { font-size: 14.5px; font-weight: 800; }
  .icard ul { margin: 0; padding: 0 0 0 18px; }
  .icard li { margin: 0 0 6px; font-size: 14px; line-height: 1.6; word-break: keep-all; }
  .icard li:last-child { margin-bottom: 0; }
  .icard.unk li { color: var(--sub); }
  .icard .im { margin: 8px 0 0; font-size: 12px; color: var(--mute); line-height: 1.5; }
  .faq details { border-bottom: 1px solid var(--line); }
  .faq details:last-child { border-bottom: 0; }
  .faq summary { list-style: none; cursor: pointer; padding: 13px 24px 13px 0; position: relative; font-size: 14.5px; font-weight: 700; line-height: 1.45; word-break: keep-all; }
  .faq summary::-webkit-details-marker { display: none; }
  .faq summary::after { content: '+'; position: absolute; right: 2px; top: 11px; font-size: 20px; font-weight: 400; color: var(--mute); }
  .faq details[open] summary::after { content: '–'; }
  .faq .ans { padding: 0 0 14px; font-size: 14px; line-height: 1.6; color: var(--sub); word-break: keep-all; }
  .links { display: flex; flex-wrap: wrap; gap: 8px; }
  .lk { display: inline-block; padding: 9px 13px; border: 1px solid var(--line); border-radius: 999px; background: #fff; font-size: 13px; font-weight: 700; text-decoration: none; }
  .near { margin: 0 0 12px; padding: 0; list-style: none; }
  .near li { padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; line-height: 1.5; }
  .near li b { font-weight: 800; } .near li small { display: block; margin-top: 2px; font-size: 12.5px; color: var(--sub); }
  .note { margin: 10px 0 0; font-size: 11.5px; color: var(--mute); line-height: 1.5; }
  .disc { margin: 10px 0 0; padding: 9px 11px; border-radius: 8px; background: var(--unk-bg); font-size: 11.5px; color: var(--sub); line-height: 1.5; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px)); background: #fff; border-top: 1px solid var(--line); }
  .bar-in { max-width: 720px; margin: 0 auto; display: flex; gap: 8px; }
  .btn { display: flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 10px; border: 1.5px solid #dfe3ea; border-radius: 12px; background: #fff; color: var(--ink); font-size: 14px; font-weight: 800; text-decoration: none; cursor: pointer; font-family: inherit; white-space: nowrap; }
  .btn .s { display: none; } .btn .l { display: inline; }
  .btn.primary { flex: 1 1 auto; min-width: 0; background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn.mid { flex: 0 0 auto; padding: 0 12px; font-size: 13px; }
  .btn.fav { flex: 0 0 auto; padding: 0 13px; } .btn.fav.on { background: #fff1f4; border-color: #f4a6b8; color: #d6204c; }
  .empty { padding: 60px 20px; text-align: center; color: var(--sub); line-height: 1.7; }
  .toast { position: fixed; left: 50%; bottom: calc(var(--bar-h) + 18px); transform: translateX(-50%); background: rgba(31,36,48,.92); color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 13px; z-index: 20; display: none; }
  .toast.show { display: block; }
  @media (max-width: 430px) { .btn .l { display: none; } .btn .s { display: inline; } .btn { padding: 0 10px; font-size: 13.5px; } .btn.mid, .btn.fav { flex: 1 1 0; padding: 0 6px; } .btn.primary { flex: 1.25 1 0; } }
  @media (max-width: 360px) { .btn.mid { padding: 0 9px; font-size: 12px; } .agebar { grid-template-columns: 96px 1fr 50px; } }
  @media (min-width: 768px) { .hero { border-radius: 0 0 16px 16px; } .wrap { background: transparent; } .infra { grid-template-columns: repeat(2, minmax(0, 1fr)); } .icard.wide { grid-column: 1 / -1; } }
  @media (min-width: 1024px) { .wrap { max-width: 760px; } .bar-in { max-width: 760px; } }
</style>

<body>
<div class="top"><button class="back" id="back" type="button" aria-label="뒤로">‹ 뒤로</button><a class="logo" href="./">Buyg</a></div>
<div class="wrap" id="app"><div class="empty">불러오는 중…</div></div>
<div class="toast" id="toast" role="status"></div>

<script src="planner.js"></script>
<script>
// ===== 설정 =====
const COUPANG_PARTNER_ID = '';   // 쿠팡 파트너스 계정 연동 전: 비어 있으면 일반 검색 링크 + 고지 문구는 숨김. 값이 생기면 준비물 링크를 제휴 링크로 바꾸고 고지 문구를 표시한다.
const COUPANG_DISCLOSURE = '쿠팡 파트너스 활동의 일환으로 수수료를 제공받을 수 있습니다.';
const FAV_KEY = 'buyg_place_favs_v1';
const AGE = [['baby', '0~1세 베이비', '~12개월'], ['toddler', '2~3세 토들러', '12~36개월'], ['kid', '4~5세 키즈', '3~5세'], ['preschool', '6~7세 프리스쿨', '6~7세']];
const LEVEL = ['정보 없음', '보통', '좋아요', '특히 추천'];
const PREP = {
  museum: [['여벌 양말', '유아 미끄럼방지 양말'], ['휴대용 물티슈', '아기 물티슈 휴대용'], ['아기띠', '아기띠 신생아']],
  forest: [['아기 선크림·모자', '아기 선크림 모자'], ['모기 기피 패치', '아기 모기패치'], ['휴대용 돗자리', '피크닉 돗자리'], ['물티슈', '아기 물티슈 휴대용']],
  zoo: [['유모차 선풍기', '유모차 선풍기 클립'], ['아기 선크림·모자', '아기 선크림 모자'], ['휴대용 물티슈', '아기 물티슈 휴대용'], ['여벌 옷 파우치', '아기 여벌 옷 파우치']],
  outdoor: [['아기 선크림·모자', '아기 선크림 모자'], ['휴대용 돗자리', '피크닉 돗자리']],
  indoor: [['여벌 양말', '유아 미끄럼방지 양말'], ['휴대용 물티슈', '아기 물티슈 휴대용']],
  water: [['유아 래시가드', '유아 래시가드'], ['수영장 기저귀', '아기 수영 기저귀']],
};

// ===== 유틸 =====
const $ = (s, r) => (r || document).querySelector(s);
function h(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function ga(name, p) { if (typeof window.gtag === 'function') { try { window.gtag('event', name, p); } catch (e) { /* 무시 */ } } }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200); }
function favs() { try { const a = JSON.parse(localStorage.getItem(FAV_KEY) || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; } }
function isFav(id) { return favs().some(f => f && f.id === id); }
function toggleFav(rec) {
  const l = favs(), i = l.findIndex(f => f && f.id === rec.id);
  if (i >= 0) l.splice(i, 1); else l.push(Object.assign({}, rec, { saved_at: Date.now() }));
  try { localStorage.setItem(FAV_KEY, JSON.stringify(l)); } catch (e) { /* 저장소 차단 */ }
  return isFav(rec.id);
}
function naverMap(q) { return 'https://map.naver.com/p/search/' + encodeURIComponent(String(q || '').replace(/\([^)]*\)/g, ' ').replace(/\s+/g, ' ').trim()); }
function shop(q) { return 'https://search.shopping.naver.com/search/all?query=' + encodeURIComponent(q); }
function src(el, url) { if (!url) return; const a = h('a', 'src', '출처'); a.href = url; a.target = '_blank'; a.rel = 'noopener'; el.appendChild(a); }
async function getJson(url, key) { try { const r = await fetch(url, { cache: 'no-store' }); if (!r.ok) return null; const d = await r.json(); return key ? (d[key] || []) : d; } catch (e) { return null; } }

// ===== 데이터: 가이드(공식 확인 내용) + 기본 데이터(행사/예약/시드) 병합 =====
async function loadPlace(id) {
  const [guides, spots, events, reserve] = await Promise.all([
    getJson('./place_guides.json'), getJson('./free_spots_seed.json', 'spots'), getJson('./tour_events.json', 'events'), getJson('./seoul_reserve.json', 'items')]);
  const guide = guides && guides.places && guides.places[id] || null;
  const base = (spots || []).find(x => x.id === id) || (events || []).find(x => x.id === id) || (reserve || []).find(x => x.id === id) || null;
  if (!guide && !base) return null;
  const kind = guide ? 'guide' : (id.indexOf('tour_') === 0 ? 'event' : id.indexOf('seoul_') === 0 ? 'reserve' : 'spot');
  return { id, guide, base, kind, spots: spots || [] };
}

// ===== 렌더 =====
function pillsFor(p) {
  const box = h('div', 'pills'), g = p.guide, b = p.base || {};
  const fee = g ? g.facts.fee.v : null;
  if (g) {
    if (/^무료/.test(fee || '')) box.appendChild(h('span', 'pill ok', '무료입장'));
    else if (fee && /만 5세 이하 무료/.test(fee)) box.appendChild(h('span', 'pill ok', '영유아 무료'));
    else if (!fee) box.appendChild(h('span', 'pill', '요금 확인 필요'));
    const rs = g.facts.reservation.v;
    if (rs && /사전 예약/.test(rs)) box.appendChild(h('span', 'pill blue', '차량 사전예약'));
  } else {
    if (b.is_free === true || b.fee_type === 'free') box.appendChild(h('span', 'pill ok', '무료입장'));
    else if (b.fee_min > 0) box.appendChild(h('span', 'pill', b.fee_min.toLocaleString('ko-KR') + '원~'));
    else if (b.tag) box.appendChild(h('span', 'pill ' + (/^무료/.test(b.tag) ? 'ok' : ''), b.tag));
    else box.appendChild(h('span', 'pill', '요금 확인 필요'));
    if (p.kind === 'reserve') box.appendChild(h('span', 'pill blue', '사전예약'));
  }
  const ages = (b.age_groups && b.age_groups.length) ? b.age_groups : g ? AGE.filter(a => g.age_fit[a[0]] >= 3).map(a => a[0]) : [];
  ages.forEach(k => { const a = AGE.find(x => x[0] === k); if (a) box.appendChild(h('span', 'pill brand', a[1])); });
  return box;
}
function factRow(dl, label, f) {
  const row = h('div', 'fact'), dt = h('dt', '', label), dd = h('dd');
  if (f && f.v) { dd.textContent = f.v; src(dd, f.src); } else { dd.className = 'unk'; dd.textContent = '확인 필요'; }
  row.appendChild(dt); row.appendChild(dd); dl.appendChild(row);
}
function baseFacts(p) {
  const b = p.base || {}, f = (v) => (v ? { v, src: null } : null);
  const period = b.start_date ? (b.end_date && b.end_date !== b.start_date ? b.start_date + ' ~ ' + b.end_date : b.start_date) : '';
  return { address: f(b.address || b.place), tel: f(b.tel), hours: f(period ? '행사 기간 ' + period : ''), fee: f(b.fee_text || b.tag), reservation: f(b.reserve_url ? '사전 예약 필요(접수 마감 ' + (b.rcpt_end || '확인') + ')' : '') };
}
function accordionList(items, openFirst) {   // 핵심 2개 먼저, 나머지는 더보기
  const box = h('div'), ul = h('ul', 'bul'), rest = h('ul', 'bul fold');
  items.forEach((it, i) => { const li = h('li', '', it.text); src(li, it.src); (i < (openFirst || 2) ? ul : rest).appendChild(li); });
  box.appendChild(ul);
  if (items.length > (openFirst || 2)) {

  const sync = () => { const on = isFav(p.id); fav.classList.toggle('on', on); fav.textContent = ''; fav.appendChild(h('span', 'l', on ? '♥ 찜함' : '♡ 가볼곳 찜')); fav.appendChild(h('span', 's', on ? '♥ 찜함' : '♡ 찜')); fav.setAttribute('aria-pressed', on ? 'true' : 'false'); };
  sync(); fav.addEventListener('click', () => { const on = toggleFav(rec); sync(); ga('place_fav_toggle', { id: p.id, on: on ? 1 : 0 }); toast(on ? '가볼곳에 담았어요' : '찜을 해제했어요'); });
  inn.appendChild(nav); inn.appendChild(mp); inn.appendChild(fav); bar.appendChild(inn); document.body.appendChild(bar);
  ga('place_page_view', { id: p.id, kind: p.kind });
}

(async function init() {
  const id = new URLSearchParams(location.search).get('id') || '';
  $('#back').addEventListener('click', () => { if (history.length > 1) history.back(); else location.href = 'outing.html'; });
  if (!id) { $('#app').innerHTML = '<div class="empty">장소를 찾을 수 없어요.<br><a href="outing.html">나들이 목록으로 가기</a></div>'; return; }
  const p = await loadPlace(id.replace(/[^\w-]/g, ''));
  if (!p) { $('#app').innerHTML = '<div class="empty">장소를 찾을 수 없어요.<br><a href="outing.html">나들이 목록으로 가기</a></div>'; return; }
  render(p);
})();
</script>
