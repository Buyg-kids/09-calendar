<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나의 주말 일정표 | BUYG(바이그)</title>
<meta name="description" content="장소·식당을 고르면 타임테이블과 예상 비용을 계산해 드려요. 로그인 없이 이 기기에 저장돼요.">
<meta name="robots" content="noindex">
<style>
  :root { --brand: #5f0080; --ink: #1f2430; --sub: #667085; --mute: #98a2b3; --line: #eceef3; --bg: #f7f8fa; --ok: #1b7a46; --ok-bg: #e9f6ef; --warn: #a15c00; --warn-bg: #fff3e0; --blue: #1d4ed8; --blue-bg: #e8f0ff; --unk-bg: #f1f3f7; --bar-h: 64px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; -webkit-text-size-adjust: 100%; }
  a { color: inherit; }
  .wrap { max-width: 720px; margin: 0 auto; padding-bottom: calc(var(--bar-h) + 24px + env(safe-area-inset-bottom, 0px)); }
  .top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 14px; background: rgba(255,255,255,.96); border-bottom: 1px solid var(--line); backdrop-filter: blur(6px); }
  .top .back { border: 0; background: none; font-size: 15px; font-weight: 700; padding: 8px 4px; cursor: pointer; font-family: inherit; color: var(--ink); }
  .top .logo { margin-left: auto; font-size: 16px; font-weight: 800; color: var(--brand); text-decoration: none; }
  .intro { padding: 20px 18px 6px; background: #fff; }
  h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
  .lead { margin: 6px 0 14px; font-size: 13.5px; color: var(--sub); line-height: 1.5; }
  section.step { margin: 10px 0 0; padding: 18px; background: #fff; }
  section.step > h2 { margin: 0 0 12px; font-size: 15.5px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .no { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; background: var(--brand); color: #fff; font-size: 12px; font-weight: 800; }
  .hint { margin: -4px 0 10px; font-size: 12px; color: var(--mute); line-height: 1.5; }
  .choices { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { padding: 10px 14px; border: 1.5px solid #dfe3ea; border-radius: 999px; background: #fff; font-size: 14px; font-weight: 700; color: var(--sub); cursor: pointer; font-family: inherit; }
  .chip.on { border-color: var(--brand); background: #f6ecfa; color: var(--brand); }
  .chip[disabled] { opacity: .55; cursor: default; }
  .party { display: grid; gap: 4px; }
  .prow { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .prow:last-child { border-bottom: 0; }
  .prow .nm b { display: block; font-size: 14.5px; } .prow .nm span { font-size: 12px; color: var(--mute); }
  .step-btns { display: flex; align-items: center; gap: 12px; }
  .step-btns button { width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid #dfe3ea; background: #fff; font-size: 18px; font-weight: 700; cursor: pointer; font-family: inherit; color: var(--ink); }
  .step-btns output { min-width: 18px; text-align: center; font-size: 16px; font-weight: 800; }
  .opt { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 14px; }
  .opt input { width: 18px; height: 18px; }
  .eat { display: block; width: 100%; text-align: left; margin: 0 0 8px; padding: 12px; border: 1.5px solid var(--line); border-radius: 14px; background: #fff; cursor: pointer; font-family: inherit; color: var(--ink); }
  .eat.on { border-color: var(--brand); background: #fbf5fd; }
  .eat span.unk { color: var(--warn); font-size: 12px; font-weight: 700; }
  .eat b { display: block; font-size: 14.5px; } .eat span { display: block; margin-top: 3px; font-size: 12.5px; color: var(--sub); line-height: 1.45; }
  .money { display: grid; grid-template-columns: 1fr 120px; gap: 8px; align-items: center; margin-top: 10px; font-size: 14px; }
  .money input { width: 100%; height: 40px; padding: 0 10px; border: 1.5px solid #dfe3ea; border-radius: 10px; font-size: 15px; text-align: right; font-family: inherit; }
  .note { margin: 10px 0 0; font-size: 12px; color: var(--mute); line-height: 1.5; }
  .tt { list-style: none; margin: 0; padding: 0; }
  .tt li { display: grid; grid-template-columns: 92px 1fr; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; line-height: 1.45; }
  .tt li:last-child { border-bottom: 0; }
  .tt .tm { font-weight: 800; font-variant-numeric: tabular-nums; color: var(--brand); } .tt .sm { display: block; margin-top: 2px; font-size: 12px; color: var(--mute); font-weight: 500; }
  .tt li.move, .tt li.wait { color: var(--sub); font-size: 13.5px; } .tt li.move .tm, .tt li.wait .tm { color: var(--mute); }
  .warn { margin: 12px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--warn-bg); color: var(--warn); font-size: 13px; line-height: 1.5; }
  .bt { width: 100%; border-collapse: collapse; font-size: 14px; }
  .bt td { padding: 10px 0; border-bottom: 1px solid var(--line); vertical-align: top; } .bt td:last-child { text-align: right; font-weight: 800; white-space: nowrap; padding-left: 10px; }
  .bt small { display: block; margin-top: 2px; font-size: 11.5px; color: var(--mute); font-weight: 500; line-height: 1.4; }
  .bt tr.unk td:last-child { color: var(--warn); }
  .badge { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px; background: #eef2ff; color: #3b4cc0; font-size: 11px; font-weight: 700; vertical-align: 1px; }
  .total .sub { display: block; margin-top: 4px; font-size: 12px; font-weight: 600; color: var(--sub); }
  .tsplit { margin-top: 8px; display: grid; gap: 4px; padding: 0 2px; font-size: 12.5px; color: var(--sub); }
  .tsplit div { display: flex; justify-content: space-between; }
  details.fq { border-bottom: 1px solid var(--line); }
  details.fq:last-child { border-bottom: 0; }
  details.fq summary { list-style: none; cursor: pointer; padding: 13px 24px 13px 0; position: relative; font-size: 14.5px; font-weight: 700; line-height: 1.45; word-break: keep-all; }
  details.fq summary::-webkit-details-marker { display: none; }
  details.fq summary::after { content: '+'; position: absolute; right: 2px; top: 11px; font-size: 20px; font-weight: 400; color: var(--mute); }
  details.fq[open] summary::after { content: '–'; }
  details.fq .fa { padding: 0 0 14px; font-size: 13.5px; line-height: 1.65; color: var(--sub); word-break: keep-all; }
  details.fq .fa p { margin: 0 0 6px; } details.fq .fa p:last-child { margin-bottom: 0; }
  .total { margin-top: 12px; padding: 14px; border-radius: 12px; background: #f6ecfa; display: flex; justify-content: space-between; align-items: baseline; font-weight: 800; }
  .total strong { font-size: 20px; color: var(--brand); }
  .unkbox { margin-top: 10px; padding: 11px 12px; border-radius: 10px; background: var(--unk-bg); font-size: 12.5px; color: var(--sub); line-height: 1.5; }
  .ghost { display: block; width: 100%; margin-top: 14px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: #fff; font-size: 13.5px; font-weight: 700; color: var(--sub); cursor: pointer; font-family: inherit; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px)); background: #fff; border-top: 1px solid var(--line); }
  .bar-in { max-width: 720px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .bar .sum { font-size: 12.5px; color: var(--sub); line-height: 1.35; } .bar .sum b { display: block; font-size: 17px; color: var(--ink); }
  .bar a.go { flex: 0 0 auto; padding: 12px 18px; border-radius: 12px; background: var(--brand); color: #fff; font-size: 14px; font-weight: 800; text-decoration: none; }
  /* 다이어리 감성 */
  :root { --paper: #fffaf0; --paper-line: #f0e6d0; --ink-warm: #5b4636; --tape: #f3d9a4; }
  .when { display: grid; gap: 10px; }
  .when label.dt { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; font-weight: 700; }
  .when input[type=date] { height: 42px; padding: 0 10px; border: 1.5px solid #dfe3ea; border-radius: 10px; font-size: 15px; font-family: inherit; color: var(--ink); background: #fff; min-width: 0; }
  .wxbox { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: #fff7e6; border: 1px solid #f4e1b8; }
  .wxbox .wi { font-size: 34px; line-height: 1; flex: 0 0 auto; }
  .wxbox .wt { min-width: 0; } .wxbox .wt b { display: block; font-size: 15px; color: var(--ink-warm); }
  .wxbox .wt span { display: block; margin-top: 2px; font-size: 13px; color: var(--sub); line-height: 1.4; word-break: keep-all; }
  .wxbox.warn { background: #eef4ff; border-color: #cfdcf7; } .wxbox.none { background: var(--unk-bg); border-color: var(--line); } .wxbox.none .wi { font-size: 26px; }
  section.diary { margin: 10px 0 0; padding: 22px 16px 18px; background: var(--paper); position: relative; border-top: 1px solid var(--paper-line); border-bottom: 1px solid var(--paper-line); }
  section.diary::before { content: ''; position: absolute; left: 50%; top: -9px; width: 86px; height: 20px; margin-left: -43px; background: var(--tape); opacity: .85; transform: rotate(-2deg); border-radius: 2px; }
  section.diary > h2 { margin: 0 0 4px; font-size: 17px; font-weight: 800; color: var(--ink-warm); display: flex; align-items: center; gap: 8px; }
  .dhead { margin: 0 0 14px; font-size: 13px; color: #8a7561; line-height: 1.5; }
  .dhead .pin { vertical-align: -3px; margin-right: 4px; }
  .tl { list-style: none; margin: 0; padding: 0; position: relative; }
  .tl::before { content: ''; position: absolute; left: 61px; top: 8px; bottom: 8px; border-left: 2px dashed #e4d3b0; }
  .tl li { position: relative; display: grid; grid-template-columns: 44px 1fr; gap: 28px; padding: 0 0 12px; }
  .tl li:last-child { padding-bottom: 0; }
  .tl .tm { padding-top: 11px; font-size: 12.5px; font-weight: 800; color: var(--ink-warm); font-variant-numeric: tabular-nums; text-align: right; line-height: 1.25; }
  .tl .tm i { display: block; font-style: normal; font-weight: 600; color: #b3a28c; font-size: 11px; }
  .tl .cd { position: relative; padding: 10px 12px; border-radius: 12px; background: #fff; border: 1px solid var(--paper-line); box-shadow: 0 1px 0 rgba(120,90,40,.06); font-size: 14.5px; line-height: 1.45; color: var(--ink); word-break: keep-all; }
  .tl .cd::before { content: ''; position: absolute; left: -20px; top: 15px; width: 10px; height: 10px; border-radius: 50%; background: var(--brand); border: 2px solid var(--paper); box-sizing: content-box; }
  .tl .cd .sm { display: block; margin-top: 3px; font-size: 12px; color: #9a8a76; font-weight: 500; }
  .tl .cd .ic { margin-right: 4px; }
  .tl li.move .cd, .tl li.wait .cd { background: transparent; border-style: dashed; color: var(--sub); font-size: 13px; padding: 7px 12px; }
  .tl li.move .cd::before, .tl li.wait .cd::before { background: #d7c7a6; width: 8px; height: 8px; left: -19px; top: 12px; }
  .tl li.end .cd { background: #fdf0d5; border-color: #f0dba9; font-weight: 700; }
  .tl li.end .cd::before { background: #e0a43a; }
  section.diary .warn { background: #fff0d8; margin-top: 12px; }
  .dact { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
  .dact button { padding: 13px 8px; border-radius: 12px; font-size: 14px; font-weight: 800; cursor: pointer; font-family: inherit; border: 1.5px solid var(--brand); }
  .dact .sv { background: #fff; color: var(--brand); } .dact .sh { background: var(--brand); color: #fff; }
  .dact .sv.done { background: #f6ecfa; }
  .saved { margin-top: 12px; display: grid; gap: 6px; }
  .saved h3 { margin: 4px 0 0; font-size: 12.5px; color: #8a7561; font-weight: 700; }
  .saved .sr { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 10px; background: #fff; border: 1px solid var(--paper-line); }
  .saved .sr button.ld { flex: 1; min-width: 0; text-align: left; border: 0; background: none; font-family: inherit; font-size: 13px; color: var(--ink); cursor: pointer; padding: 4px 0; }
  .saved .sr button.rm { border: 0; background: none; color: var(--mute); font-size: 12px; cursor: pointer; padding: 4px 6px; font-family: inherit; }
  .toast { position: fixed; left: 50%; bottom: calc(var(--bar-h) + 22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 20; max-width: 86vw; padding: 10px 16px; border-radius: 999px; background: rgba(31,36,48,.92); color: #fff; font-size: 13px; }
  .bt { background: transparent; }
  .empty { padding: 50px 20px; text-align: center; color: var(--sub); line-height: 1.7; }
</style>
</head>
<body>
<div class="top"><button class="back" id="back" type="button">‹ 뒤로</button><a class="logo" href="./">Buyg</a></div>
<div class="wrap" id="app"><div class="empty">불러오는 중…</div></div>
<script src="planner.js"></script>
<script>
const $ = (s, r) => (r || document).querySelector(s);
function h(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function ga(n, p) { if (typeof window.gtag === 'function') { try { window.gtag('event', n, p); } catch (e) { /* 무시 */ } } }
let GUIDES = {}, STATE = Planner.loadPlan();
const AGE_ROWS = [['adult', '어른', '만 19~64세'], ['teen', '청소년', '만 13~18세'], ['child', '어린이', '만 6~12세'], ['toddler', '영유아', '만 5세 이하']];

function save() { STATE = Planner.savePlan(STATE); }
function placeList() { return Object.values(GUIDES).filter(p => p.costs); }

function section(no, title, hint) { const s = h('section', 'step'); const t = h('h2'); t.appendChild(h('span', 'no', String(no))); t.appendChild(document.createTextNode(title)); s.appendChild(t); if (hint) s.appendChild(h('p', 'hint', hint)); return s; }
function chip(label, on, fn, disabled) { const b = h('button', 'chip' + (on ? ' on' : ''), label); b.type = 'button'; if (disabled) b.disabled = true; else b.addEventListener('click', fn); b.setAttribute('aria-pressed', on ? 'true' : 'false'); return b; }
function set(fn) { fn(STATE); save(); render(); }

function eatSub(b, e) {   // 식당·카페 선택 카드의 보조 문구: 목록형은 확인된 판매품목 + '매장 확인 필요', 후기형은 추천 대상·피크
  if (e.level === 'listed') { if (e.menu && e.menu.v) b.appendChild(h('span', '', e.menu.v)); b.appendChild(h('span', 'unk', '아기의자 · 주차 · 유모차 진입은 매장 확인 필요')); return; }
  if (e.recommend_for && e.recommend_for.v) b.appendChild(h('span', '', e.recommend_for.v));
  if (e.peak) b.appendChild(h('span', '', '붐비는 시간: ' + e.peak.label));
}


function toast(msg) { let el = $('.toast'); if (!el) { el = h('div', 'toast'); el.setAttribute('role', 'status'); document.body.appendChild(el); } el.textContent = msg; el.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(() => { el.style.display = 'none'; }, 2200); }
const WX = {};   // 'lat,lon,date' -> 예보(또는 {error})
function pinSvg() { return '<svg class="pin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#b5483a" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 10-14 0c0 5.8 7 12 7 12z" fill="#f6c9bf"/><circle cx="12" cy="10" r="2.4" fill="#fff"/></svg>'; }
function loadWeather(place, iso, box) {
  const geo = place.geo; const d = Planner.daysFrom(new Date(), iso);
  const show = (cls, icon, title, sub) => { box.className = 'wxbox ' + cls; box.innerHTML = ''; box.appendChild(h('div', 'wi', icon)); const w = h('div', 'wt'); w.appendChild(h('b', '', title)); if (sub) w.appendChild(h('span', '', sub)); box.appendChild(w); };
  if (!geo) return show('none', '🌡️', '날씨 정보를 불러올 수 없어요', '이 장소의 위치 정보가 아직 없어요.');
  if (!(d >= 0)) return show('none', '🗓️', '지난 날짜예요', '오늘 이후 날짜를 골라 주세요.');
  if (d > 15) return show('none', '🗓️', '아직 예보가 없어요', '날씨 예보는 오늘부터 16일 이내만 볼 수 있어요. 가까워지면 다시 확인해 주세요.');
  const key = geo.lat + ',' + geo.lon + ',' + iso;
  const draw = f => {
    if (!f || f.error) return show('none', '🌡️', '날씨 정보를 불러오지 못했어요', '잠시 후 다시 시도해 주세요.');
    const w = Planner.wmo(f.code), a = Planner.weatherAdvice(f, place.theme);
    show(a.tone === 'warn' ? 'warn' : '', w.icon, w.label + ' ' + Math.round(f.tmax) + '℃' + (isFinite(f.tmin) ? ' (최저 ' + Math.round(f.tmin) + '℃)' : '') + ' · ' + a.text.split(' · ')[0], (a.text.indexOf(' · ') > 0 ? a.text.split(' · ')[1] + ' · ' : '') + (typeof f.pop === 'number' ? '강수확률 ' + f.pop + '% · ' : '') + '예보 출처 Open-Meteo');
  };
  if (WX[key]) return draw(WX[key]);
  show('none', '⏳', '날씨를 확인하는 중…', '');
  fetch('https://api.open-meteo.com/v1/forecast?latitude=' + geo.lat + '&longitude=' + geo.lon + '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FSeoul&start_date=' + iso + '&end_date=' + iso)
    .then(r => r.json()).then(j => { const dd = j && j.daily; WX[key] = dd && dd.time && dd.time.length ? { code: dd.weather_code[0], tmax: dd.temperature_2m_max[0], tmin: dd.temperature_2m_min[0], pop: dd.precipitation_probability_max ? dd.precipitation_probability_max[0] : null } : { error: 1 }; })
    .catch(() => { WX[key] = { error: 1 }; }).then(() => { if (box.isConnected) draw(WX[key]); });
}
function planTitle(place) { return place.name + (STATE.visit_date ? ' · ' + Planner.dateLabel(STATE.visit_date) : ''); }
function shareUrl() { return location.origin + location.pathname + '?s=' + Planner.encodePlan(STATE); }
function sharePlan(place) {
  const url = shareUrl(), title = '나의 주말 일정 · ' + planTitle(place), text = title + '\n(예상 합계는 링크에서 확인해요)';
  ga('plan_share', { id: place.id });
  if (navigator.share) { navigator.share({ title: title, text: text, url: url }).catch(() => { /* 사용자가 닫음 */ }); return; }
  const done = () => toast('링크를 복사했어요. 카카오톡에 붙여넣어 보내 보세요');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, () => prompt('아래 링크를 복사해 주세요', url));
  else prompt('아래 링크를 복사해 주세요', url);
}

function render() {
  const app = $('#app'); const keepY = window.scrollY; app.innerHTML = '';
  const intro = h('div', 'intro'); intro.appendChild(h('h1', '', '나의 주말 일정표')); intro.appendChild(h('p', 'lead', '장소와 식당을 고르면 타임테이블과 예상 비용을 계산해 드려요. 로그인 없이 이 기기에만 저장돼요.')); app.appendChild(intro);
  const place = GUIDES[STATE.place_id];

  // 1) 장소
  { const s = section(1, '어디로 갈까요?'); const box = h('div', 'choices');
    placeList().forEach(p => box.appendChild(chip(p.name, p.id === STATE.place_id, () => set(st => { if (st.place_id !== p.id) { st.eat_id = null; st.cafe_id = null; st.extras.theme_garden = false; } st.place_id = p.id; }))));
    s.appendChild(box); app.appendChild(s); }
  if (!place) { const e = h('div', 'empty', '장소를 선택하면 일정이 만들어져요.'); app.appendChild(e); renderBar(null); return; }

  // 방문 예정일 · 날씨
  { const s = section(2, '언제 가나요?'); const wrap = h('div', 'when');
    const lb = h('label', 'dt'); lb.appendChild(h('span', '', '방문 예정일')); const di = document.createElement('input'); di.type = 'date'; di.value = STATE.visit_date || ''; di.min = Planner.isoDate(new Date());
    di.addEventListener('change', () => set(st => { st.visit_date = Planner.parseIso(di.value) ? di.value : ''; })); lb.appendChild(di); wrap.appendChild(lb);
    const wx = h('div', 'wxbox none'); wrap.appendChild(wx); s.appendChild(wrap); app.appendChild(s);

function renderBar(r) {

  bar.appendChild(inn); document.body.appendChild(bar);
}
(async function () {
  $('#back').addEventListener('click', () => { if (history.length > 1) history.back(); else location.href = 'outing.html'; });
  try { const r = await fetch('./place_guides.json', { cache: 'no-store' }); GUIDES = (await r.json()).places || {}; } catch (e) { GUIDES = {}; }
  const q = new URLSearchParams(location.search).get('place');
  if (q && GUIDES[q] && GUIDES[q].costs && STATE.place_id !== q) { STATE.place_id = q; STATE.eat_id = null; STATE.cafe_id = null; STATE.extras.theme_garden = false; save(); }
  const sp = new URLSearchParams(location.search).get('s');
  if (sp) { const got = Planner.decodePlan(sp); if (got && GUIDES[got.place_id] && GUIDES[got.place_id].costs) { STATE = Planner.savePlan(got); setTimeout(() => toast('공유받은 일정을 불러왔어요'), 300); } try { history.replaceState(null, '', location.pathname); } catch (e) { /* 무시 */ } }
  if (STATE.place_id && !(GUIDES[STATE.place_id] && GUIDES[STATE.place_id].costs)) STATE.place_id = '';
  if (!STATE.visit_date) { STATE.visit_date = Planner.nextSaturday(new Date()); save(); }
  render();
})();
