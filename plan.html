<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나의 주말 일정표 | BUYG(바이그)</title>
<meta name="description" content="장소·식당을 고르면 타임테이블과 예상 비용을 계산해 드려요. 로그인 없이 이 기기에 저장돼요.">
<meta name="robots" content="noindex">
<style>
  :root { --brand: #5f0080; --ink: #1f2430; --sub: #667085; --mute: #98a2b3; --line: #eceef3; --bg: #f7f8fa; --ok: #1b7a46; --ok-bg: #e9f6ef; --warn: #a15c00; --warn-bg: #fff3e0; --blue: #1d4ed8; --blue-bg: #e8f0ff; --unk-bg: #f1f3f7; --bar-h: 64px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; -webkit-text-size-adjust: 100%; }
  a { color: inherit; }
  .wrap { max-width: 720px; margin: 0 auto; padding-bottom: calc(var(--bar-h) + 24px + env(safe-area-inset-bottom, 0px)); }
  .top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 14px; background: rgba(255,255,255,.96); border-bottom: 1px solid var(--line); backdrop-filter: blur(6px); }
  .top .back { border: 0; background: none; font-size: 15px; font-weight: 700; padding: 8px 4px; cursor: pointer; font-family: inherit; color: var(--ink); }
  .top .logo { margin-left: auto; font-size: 16px; font-weight: 800; color: var(--brand); text-decoration: none; }
  .top .logo { display: inline-flex; align-items: center; gap: 6px; flex: none; white-space: nowrap; }
  .logo-face { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; flex: none; background: #f2f1ee; }
  .intro { padding: 20px 18px 6px; background: #fff; }
  h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
  .lead { margin: 6px 0 14px; font-size: 13.5px; color: var(--sub); line-height: 1.5; }
  section.step, section.diary, .vbud { scroll-margin-top: 56px; }   /* 고정 헤더(48px)에 질문 제목이 가려지지 않게 */
  section.step { margin: 10px 0 0; padding: 18px 18px 26px; background: #fff; }
  .skiprow { margin-top: 2px; margin-bottom: 4px; }
  section.step > h2 { margin: 0 0 12px; font-size: 15.5px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .no { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; background: var(--brand); color: #fff; font-size: 12px; font-weight: 800; }
  .hint { margin: -4px 0 10px; font-size: 12px; color: var(--mute); line-height: 1.5; }
  .choices { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { padding: 10px 14px; border: 1.5px solid #dfe3ea; border-radius: 999px; background: #fff; font-size: 14px; font-weight: 700; color: var(--sub); cursor: pointer; font-family: inherit; }
  .chip.on { border-color: var(--brand); background: #f6ecfa; color: var(--brand); }
  .chip[disabled] { opacity: .55; cursor: default; }
  .party { display: grid; gap: 4px; }
  .prow { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .prow:last-child { border-bottom: 0; }
  .prow .nm b { display: block; font-size: 14.5px; } .prow .nm span { font-size: 12px; color: var(--mute); }
  .step-btns { display: flex; align-items: center; gap: 12px; }
  .step-btns button { width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid #dfe3ea; background: #fff; font-size: 18px; font-weight: 700; cursor: pointer; font-family: inherit; color: var(--ink); }
  .step-btns output { min-width: 18px; text-align: center; font-size: 16px; font-weight: 800; }
  .opt { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 14px; }
  .opt input { width: 18px; height: 18px; }
  .eat { display: block; width: 100%; text-align: left; margin: 0 0 8px; padding: 12px; border: 1.5px solid var(--line); border-radius: 14px; background: #fff; cursor: pointer; font-family: inherit; color: var(--ink); }
  .eat.on { border-color: var(--brand); background: #fbf5fd; }
  .eat span.unk { color: var(--warn); font-size: 12px; font-weight: 700; }
  .eat b { display: block; font-size: 14.5px; } .eat span { display: block; margin-top: 3px; font-size: 12.5px; color: var(--sub); line-height: 1.45; }
  .money { display: grid; grid-template-columns: 1fr 120px; gap: 8px; align-items: center; margin-top: 10px; font-size: 14px; }
  .money input { width: 100%; height: 40px; padding: 0 10px; border: 1.5px solid #dfe3ea; border-radius: 10px; font-size: 15px; text-align: right; font-family: inherit; }
  .note { margin: 10px 0 0; font-size: 12px; color: var(--mute); line-height: 1.5; }
  .tt { list-style: none; margin: 0; padding: 0; }
  .tt li { display: grid; grid-template-columns: 92px 1fr; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; line-height: 1.45; }
  .tt li:last-child { border-bottom: 0; }
  .tt .tm { font-weight: 800; font-variant-numeric: tabular-nums; color: var(--brand); } .tt .sm { display: block; margin-top: 2px; font-size: 12px; color: var(--mute); font-weight: 500; }
  .tt li.move, .tt li.wait { color: var(--sub); font-size: 13.5px; } .tt li.move .tm, .tt li.wait .tm { color: var(--mute); }
  .warn { margin: 12px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--warn-bg); color: var(--warn); font-size: 13px; line-height: 1.5; }
  .bt { width: 100%; border-collapse: collapse; font-size: 14px; }
  .bt td { padding: 10px 0; border-bottom: 1px solid var(--line); vertical-align: top; } .bt td:last-child { text-align: right; font-weight: 800; white-space: nowrap; padding-left: 10px; }
  .bt small { display: block; margin-top: 2px; font-size: 11.5px; color: var(--mute); font-weight: 500; line-height: 1.4; }
  .bt tr.unk td:last-child { color: var(--warn); }
  .badge { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px; background: #eef2ff; color: #3b4cc0; font-size: 11px; font-weight: 700; vertical-align: 1px; }
  .total .sub { display: block; margin-top: 4px; font-size: 12px; font-weight: 600; color: var(--sub); }
  .tsplit { margin-top: 8px; display: grid; gap: 4px; padding: 0 2px; font-size: 12.5px; color: var(--sub); }
  .tsplit div { display: flex; justify-content: space-between; }
  details.fq { border-bottom: 1px solid var(--line); }
  details.fq:last-child { border-bottom: 0; }
  details.fq summary { list-style: none; cursor: pointer; padding: 13px 24px 13px 0; position: relative; font-size: 14.5px; font-weight: 700; line-height: 1.45; word-break: keep-all; }
  details.fq summary::-webkit-details-marker { display: none; }
  details.fq summary::after { content: '+'; position: absolute; right: 2px; top: 11px; font-size: 20px; font-weight: 400; color: var(--mute); }
  details.fq[open] summary::after { content: '–'; }
  details.fq .fa { padding: 0 0 14px; font-size: 13.5px; line-height: 1.65; color: var(--sub); word-break: keep-all; }
  details.fq .fa p { margin: 0 0 6px; } details.fq .fa p:last-child { margin-bottom: 0; }
  .total { margin-top: 12px; padding: 14px; border-radius: 12px; background: #f6ecfa; display: flex; justify-content: space-between; align-items: baseline; font-weight: 800; }
  .total strong { font-size: 20px; color: var(--brand); }
  .unkbox { margin-top: 10px; padding: 11px 12px; border-radius: 10px; background: var(--unk-bg); font-size: 12.5px; color: var(--sub); line-height: 1.5; }
  .ghost { display: block; width: 100%; margin-top: 14px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: #fff; font-size: 13.5px; font-weight: 700; color: var(--sub); cursor: pointer; font-family: inherit; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px)); background: #fff; border-top: 1px solid var(--line); }
  .bar-in { max-width: 720px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .bar .sum { font-size: 12.5px; color: var(--sub); line-height: 1.35; } .bar .sum b { display: block; font-size: 17px; color: var(--ink); }
  .bar a.go { flex: 0 0 auto; padding: 12px 18px; border-radius: 12px; background: var(--brand); color: #fff; font-size: 14px; font-weight: 800; text-decoration: none; }
  /* 다이어리 감성 */
  :root { --paper: #fffaf0; --paper-line: #f0e6d0; --ink-warm: #5b4636; --tape: #f3d9a4; }
  .when { display: grid; gap: 10px; }
  .when label.dt { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; font-weight: 700; }
  .when input[type=date] { height: 42px; padding: 0 10px; border: 1.5px solid #dfe3ea; border-radius: 10px; font-size: 15px; font-family: inherit; color: var(--ink); background: #fff; min-width: 0; }
  .wxbox { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: #fff7e6; border: 1px solid #f4e1b8; }
  .wxbox .wi { font-size: 34px; line-height: 1; flex: 0 0 auto; }
  .wxbox .wt { min-width: 0; } .wxbox .wt b { display: block; font-size: 15px; color: var(--ink-warm); }
  .wxbox .wt span { display: block; margin-top: 2px; font-size: 13px; color: var(--sub); line-height: 1.4; word-break: keep-all; }
  .wxbox.warn { background: #eef4ff; border-color: #cfdcf7; } .wxbox.none { background: var(--unk-bg); border-color: var(--line); } .wxbox.none .wi { font-size: 26px; }
  section.diary { margin: 10px 0 0; padding: 22px 16px 18px; background: var(--paper); position: relative; border-top: 1px solid var(--paper-line); border-bottom: 1px solid var(--paper-line); }
  section.diary::before { content: ''; position: absolute; left: 50%; top: -9px; width: 86px; height: 20px; margin-left: -43px; background: var(--tape); opacity: .85; transform: rotate(-2deg); border-radius: 2px; }
  section.diary > h2 { margin: 0 0 4px; font-size: 17px; font-weight: 800; color: var(--ink-warm); display: flex; align-items: center; gap: 8px; }
  .dhead { margin: 0 0 14px; font-size: 13px; color: #8a7561; line-height: 1.5; }
  .dhead .pin { vertical-align: -3px; margin-right: 4px; }
  .tl { list-style: none; margin: 0; padding: 0; position: relative; }
  .tl::before { content: ''; position: absolute; left: 61px; top: 8px; bottom: 8px; border-left: 2px dashed #e4d3b0; }
  .tl li { position: relative; display: grid; grid-template-columns: 44px 1fr; gap: 28px; padding: 0 0 12px; }
  .tl li:last-child { padding-bottom: 0; }
  .tl .tm { padding-top: 11px; font-size: 12.5px; font-weight: 800; color: var(--ink-warm); font-variant-numeric: tabular-nums; text-align: right; line-height: 1.25; }
  .tl .tm i { display: block; font-style: normal; font-weight: 600; color: #b3a28c; font-size: 11px; }
  .tl .cd { position: relative; padding: 10px 12px; border-radius: 12px; background: #fff; border: 1px solid var(--paper-line); box-shadow: 0 1px 0 rgba(120,90,40,.06); font-size: 14.5px; line-height: 1.45; color: var(--ink); word-break: keep-all; }
  .tl .cd::before { content: ''; position: absolute; left: -20px; top: 15px; width: 10px; height: 10px; border-radius: 50%; background: var(--brand); border: 2px solid var(--paper); box-sizing: content-box; }
  .tl .cd .sm { display: block; margin-top: 3px; font-size: 12px; color: #9a8a76; font-weight: 500; }
  .tl .cd .ic { margin-right: 4px; }
  .tl li.move .cd, .tl li.wait .cd { background: transparent; border-style: dashed; color: var(--sub); font-size: 13px; padding: 7px 12px; }
  .tl li.move .cd::before, .tl li.wait .cd::before { background: #d7c7a6; width: 8px; height: 8px; left: -19px; top: 12px; }
  .tl li.end .cd { background: #fdf0d5; border-color: #f0dba9; font-weight: 700; }
  .tl li.end .cd::before { background: #e0a43a; }
  section.diary .warn { background: #fff0d8; margin-top: 12px; }
  .dact { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
  .dact button { padding: 13px 8px; border-radius: 12px; font-size: 14px; font-weight: 800; cursor: pointer; font-family: inherit; border: 1.5px solid var(--brand); }
  .dact .sv { background: #fff; color: var(--brand); } .dact .sh { background: var(--brand); color: #fff; }
  .dact .sv.done { background: #f6ecfa; }
  .saved { margin-top: 12px; display: grid; gap: 6px; }
  .saved h3 { margin: 4px 0 0; font-size: 12.5px; color: #8a7561; font-weight: 700; }
  .saved .sr { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 10px; background: #fff; border: 1px solid var(--paper-line); }
  .saved .sr button.ld { flex: 1; min-width: 0; text-align: left; border: 0; background: none; font-family: inherit; font-size: 13px; color: var(--ink); cursor: pointer; padding: 4px 0; }
  .saved .sr button.rm { border: 0; background: none; color: var(--mute); font-size: 12px; cursor: pointer; padding: 4px 6px; font-family: inherit; }
  .toast { z-index: 40 !important; position: fixed; left: 50%; bottom: calc(var(--bar-h) + 22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 20; max-width: 86vw; padding: 10px 16px; border-radius: 999px; background: rgba(31,36,48,.92); color: #fff; font-size: 13px; }
  .bt { background: transparent; }
  .top .boxbtn { margin-left: auto; border: 1.5px solid #dfe3ea; background: #fff; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 800; color: var(--ink); cursor: pointer; font-family: inherit; }
  .top .boxbtn .cnt { display: inline-block; min-width: 18px; margin-left: 4px; padding: 0 5px; border-radius: 999px; background: var(--brand); color: #fff; font-size: 11px; text-align: center; }
  .top .boxbtn .cnt:empty { display: none; }
  .top .boxbtn + .logo { margin-left: 10px; }
  .dr-back { position: fixed; inset: 0; z-index: 30; background: rgba(20,16,10,.45); opacity: 0; pointer-events: none; transition: opacity .25s; }
  .dr-back.open { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; left: 0; right: 0; top: 0; z-index: 31; max-width: 720px; margin: 0 auto; max-height: 82vh; overflow-y: auto; background: var(--paper); border-radius: 0 0 20px 20px; box-shadow: 0 12px 30px rgba(0,0,0,.25); transform: translateY(-105%); transition: transform .3s ease; padding: 14px 14px 18px; overscroll-behavior: contain; }

  .drawer .dh b { font-size: 16px; color: var(--ink-warm); }
  .drawer .dh button { border: 0; background: none; font-size: 14px; font-weight: 800; color: var(--sub); cursor: pointer; padding: 6px; font-family: inherit; }
  .drawer .none { padding: 26px 8px; text-align: center; font-size: 13.5px; color: #8a7561; line-height: 1.6; }
  .sv-card { position: relative; margin-bottom: 10px; padding: 12px 12px 10px; border-radius: 14px; background: #fff; border: 1px solid var(--paper-line); }
  .sv-card.fresh { animation: pop .45s ease; }

  .sv-card .t1 b { font-size: 14.5px; line-height: 1.35; word-break: keep-all; }
  .sv-card .ok { flex: 0 0 auto; padding: 2px 8px; border-radius: 999px; background: #fde8e4; color: #c0392b; font-size: 11px; font-weight: 800; }

  .sv-card .tot small { display: block; font-weight: 500; font-size: 11px; color: var(--mute); }
  .sv-card .ab { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 10px; }
  .sv-card .ab button { padding: 10px; border-radius: 10px; font-size: 13px; font-weight: 800; cursor: pointer; font-family: inherit; border: 1.5px solid var(--brand); background: var(--brand); color: #fff; }
  .sv-card .ab button.rm { background: #fff; color: var(--sub); border-color: #dfe3ea; }
  .dtotal { display: flex; justify-content: space-between; align-items: baseline; margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: #fdf0d5; border: 1px solid #f0dba9; font-weight: 800; color: var(--ink-warm); font-size: 14px; }
  .dtotal strong { font-size: 19px; color: var(--brand); } .dtotal small { display: block; font-size: 11.5px; font-weight: 600; color: #9a8a76; }
  .dact.one { grid-template-columns: 1fr; margin-top: 8px; }
  .dact .st { background: #fff7e6; border-color: #e0a43a; color: #8a5a00; }
  .dact .st.done { background: #f1f3f7; border-color: #dfe3ea; color: var(--sub); cursor: default; }
  .diary.stamped > h2, .diary.stamped > .dhead { padding-right: 92px; }
  .stamp { position: absolute; right: 10px; top: 12px; z-index: 2; width: 84px; height: 84px; border-radius: 50%; border: 3px double #c0392b; color: #c0392b; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 900; font-size: 15px; line-height: 1.15; transform: rotate(-14deg); background: rgba(255,250,240,.55); pointer-events: none; animation: stampIn .55s cubic-bezier(.2,1.4,.4,1) both; }
  .stamp small { font-size: 10.5px; font-weight: 700; margin-top: 2px; }
  @keyframes stampIn { 0% { transform: rotate(-30deg) scale(2.4); opacity: 0; } 60% { opacity: 1; } 100% { transform: rotate(-14deg) scale(1); opacity: .92; } }
  @keyframes pop { 0% { transform: scale(.96); } 60% { transform: scale(1.02); } 100% { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .stamp, .sv-card.fresh { animation: none; } .drawer, .dr-back { transition: none; } }
  .vhead { padding: 20px 18px 4px; background: #fff; } .vhead .vb { display: inline-block; padding: 3px 10px; border-radius: 999px; background: #f6ecfa; color: var(--brand); font-size: 12px; font-weight: 800; }
  .vcta { margin: 10px 0 0; padding: 18px; background: #fff; text-align: center; }

  .vcta p { margin: 10px 0 0; font-size: 12px; color: var(--mute); line-height: 1.5; }

  .vbud { margin: 10px 0 0; padding: 18px; background: #fff; } .vbud h2 { margin: 0 0 8px; font-size: 15.5px; font-weight: 800; }
  /* 식당·카페 가로 슬라이더 */

  .ecar::-webkit-scrollbar { display: none; }

  .ecard.on { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand) inset; }
  .ecard .eph { position: relative; flex: none; height: 92px; background: linear-gradient(135deg, #f6efe3, #efe3cf); display: flex; align-items: center; justify-content: center; font-size: 34px; overflow: hidden; }
  .ecard .eph.cafe { background: linear-gradient(135deg, #f1ecf6, #e2d6ee); } .ecard .eph.jp { background: linear-gradient(135deg, #fbeaea, #f6d6d6); } .ecard .eph.kr { background: linear-gradient(135deg, #f6efe3, #efe3cf); } .ecard .eph.cn { background: linear-gradient(135deg, #fff1db, #ffe0b0); } .ecard .eph.we { background: linear-gradient(135deg, #e8f3ea, #cfe7d5); }

  .ecard .edist { position: absolute; left: 6px; bottom: 6px; z-index: 1; padding: 2px 8px; border-radius: 999px; background: rgba(31,36,48,.82); color: #fff; font-size: 11px; font-weight: 700; }
  .ecard .echk { position: absolute; right: 6px; top: 6px; z-index: 1; width: 22px; height: 22px; border-radius: 50%; background: var(--brand); color: #fff; font-size: 13px; font-weight: 800; display: none; align-items: center; justify-content: center; }
  .ecard.on .echk { display: flex; }
  .ecard .ecr { position: absolute; right: 5px; bottom: 4px; z-index: 1; font-size: 9.5px; color: #fff; text-shadow: 0 0 3px rgba(0,0,0,.7); }
  .ecard .ebd { display: flex; flex-direction: column; gap: 3px; padding: 9px 10px 10px; min-width: 0; }
  .ecard .enm { font-size: 14px; font-weight: 800; line-height: 1.3; word-break: keep-all; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  .ecard .ecat { font-size: 11.5px; font-weight: 700; color: var(--brand); }
  .ecard .emn { min-height: 2.6em; font-size: 12px; color: var(--sub); line-height: 1.3; word-break: keep-all; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .ecard .ekid { font-size: 11.5px; font-weight: 700; color: #1b7a46; }
  .ecard .ebdg { display: flex; flex-wrap: wrap; gap: 4px; min-height: 20px; margin-top: 2px; }
  .ebdg .bdg { padding: 2px 7px; border-radius: 999px; background: var(--ok-bg); color: var(--ok); font-size: 11px; font-weight: 800; }
  .ebdg .bdg { display: inline-flex; align-items: center; gap: 3px; } .bdg-ic { width: 14px; height: 14px; object-fit: contain; }
  .ebdg .unk { font-size: 11px; color: var(--mute); }
  .ehint { margin: 2px 0 8px; font-size: 12px; color: var(--mute); }
  .stopbox { display: grid; gap: 4px; padding: 12px 14px; border-radius: 12px; background: #f6ecfa; } .stopbox b { font-size: 15px; word-break: keep-all; } .stopbox span { font-size: 12.5px; color: var(--sub); line-height: 1.45; }
  .empty { padding: 50px 20px; text-align: center; color: var(--sub); line-height: 1.7; }

</head>
<body>
<div class="top"><button class="back" id="back" type="button">‹ 뒤로</button><button class="boxbtn" id="boxBtn" type="button" aria-haspopup="dialog">📁 보관함<span class="cnt" id="boxCnt"></span></button><a class="logo" href="./" aria-label="Buyg 홈으로 이동"><img class="logo-face" src="assets/img/tein_logo.webp" alt="" width="24" height="24" decoding="async">Buyg</a></div>
<div class="wrap" id="app"><div class="empty">불러오는 중…</div></div>
<script src="planner.js?v=20261017"></script>
<script src="food_thumb.js?v=20261017"></script>
<script>
const $ = (s, r) => (r || document).querySelector(s);
function h(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function ga(n, p) { if (typeof window.gtag === 'function') { try { window.gtag('event', n, p); } catch (e) { /* 무시 */ } } }
let GUIDES = {}, STATE = Planner.loadPlan();
const AGE_ROWS = [['adult', '어른', '만 19~64세'], ['teen', '청소년', '만 13~18세'], ['child', '어린이', '만 6~12세'], ['toddler', '영유아', '만 5세 이하']];

function save() { STATE = Planner.savePlan(STATE); }
let SEEDS = {}, ENR = {};   // ENR: spot_enriched.json (좌표·반경 2km 식당·카페)
function enrGeo(id) { const g = (ENR[id] || {}).geo; return g && isFinite(g.lat) && isFinite(g.lon) ? { lat: g.lat, lon: g.lon } : undefined; }
function enrEats(id) { const n = (ENR[id] || {}).nearby || {}; return [].concat(n.eats || [], n.cafes || []).filter(e => e && e.level === 'listed'); }
function ensureSeedPlace(id) {   // 시드 장소는 검증된 요금·식당 정보가 없다: 입장료·주차비는 '확인 필요', 식당은 비워 둔다
  if (!id || GUIDES[id] || !SEEDS[id]) return;
  const s = SEEDS[id], c = s.category || '', theme = /박물관|전시/.test(c) ? 'museum' : /동물/.test(c) ? 'zoo' : /공원|숲|수목|생태|산책/.test(c) ? 'forest' : '';
  const fee = String(s.tag || ''), pk = String(s.parking || '');   // 시드의 일반 정보(요금·주차). 공식 확인 전이므로 '일반 정보'로 표기하고 방문 전 확인을 안내한다
  const admission = /무료입장/.test(fee) ? { model: 'free', note: '무료입장(일반 정보 · 방문 전 공식 확인)' + (/예약/.test(fee) ? ' · 사전예약 필요' : '') } : { model: 'unknown', note: '요금은 아직 확인하지 못했어요(방문 전 공식 안내에서 확인)' };
  const parking = pk === '무료주차' ? { model: 'free', note: '무료주차(일반 정보 · 방문 전 확인)' } : { model: 'unknown', note: pk === '주차불가/대중교통' ? '주차가 어려운 곳이에요(대중교통 권장, 일반 정보)' : '주차는 유료예요(요금 미확인, 일반 정보)' };
  const SEED_COSTS = {   // 시드 장소 중 요금을 직접 확인한 곳(운영자 확인). 1일 최대 요금은 확인하지 못해 상한을 두지 않는다.
    spot_01: { admission: { model: 'free', note: '무료 관람 · 사전예약제(운영자 확인 2026-10-15)' }, parking: { model: 'tiered', free_minutes: 0, base_minutes: 120, base: 2000, step_minutes: 30, step: 500, daily_max: 1000000, note: '기본 2시간 2,000원 · 초과 30분당 500원(운영자 확인 2026-10-15, 1일 최대 요금은 미확인)' } }
  };
  GUIDES[id] = { id: id, name: s.title, region: s.region, theme: theme, seed: true, geo: enrGeo(id), eats: enrEats(id), facts: { address: { v: s.address, checked: '2026-10-08' } }, costs: SEED_COSTS[id] || { admission: admission, parking: parking } };
}

function placeList() { return Object.values(GUIDES).filter(p => p.costs); }

function section(no, title, hint) { const s = h('section', 'step'); const t = h('h2'); t.appendChild(h('span', 'no', String(no))); t.appendChild(document.createTextNode(title)); s.appendChild(t); if (hint) s.appendChild(h('p', 'hint', hint)); return s; }
function chip(label, on, fn, disabled) { const b = h('button', 'chip' + (on ? ' on' : ''), label); b.type = 'button'; if (disabled) b.disabled = true; else b.addEventListener('click', fn); b.setAttribute('aria-pressed', on ? 'true' : 'false'); return b; }
function set(fn) { fn(STATE); save(); render(); }

function haversineKm(a, b, c, d) { const R = 6371, r = Math.PI / 180, dl = (c - a) * r, dn = (d - b) * r, x = Math.sin(dl / 2) * Math.sin(dl / 2) + Math.cos(a * r) * Math.cos(c * r) * Math.sin(dn / 2) * Math.sin(dn / 2); return 2 * R * Math.asin(Math.sqrt(x)); }
async function resolveStop(key, place) {   // 홈의 묶음 코스 후보(행사 tour_*, 전시 장소 spot_*)를 찾아 2차 일정으로 만든다. 못 찾으면 null
  key = String(key || '').replace(/[^\w-]/g, '').slice(0, 60); if (!key || !place || !place.geo) return null;
  let cand = null;
  if (/^tour_/.test(key)) { try { const j = await (await fetch('./tour_events.json')).json(); const rec = (j.events || j).find(x => x.id === key); if (rec && isFinite(rec.mapy) && isFinite(rec.mapx)) cand = { name: rec.title, kind: '행사', lat: Number(rec.mapy), lon: Number(rec.mapx), free: (rec.is_free === true || rec.fee_type === 'free') ? true : null }; } catch (e) { /* 무시 */ } }
  else if (/^spot_/.test(key) && SEEDS[key] && enrGeo(key)) { const g = enrGeo(key); cand = { name: SEEDS[key].title, kind: '전시 장소', lat: g.lat, lon: g.lon, free: /무료입장/.test(SEEDS[key].tag || '') ? true : null }; }
  if (!cand) return null;
  return { key: key, name: cand.name, kind: cand.kind, meters: Math.round(haversineKm(place.geo.lat, place.geo.lon, cand.lat, cand.lon) * 1000), free: cand.free, visit_minutes: 90 };
}

function nearestEat(place, kind) {   // 숫자 거리(meters)가 있으면 가장 가까운 곳, 없으면 목록의 첫 곳
  const list = (place.eats || []).filter(e => e.kind === kind); if (!list.length) return null;
  if (list.every(e => e.distance && typeof e.distance.meters === 'number')) return list.slice().sort((a, b) => a.distance.meters - b.distance.meters)[0];
  return list[0];
}
function autoPick(place) {   // 건너뛰기를 누르지 않았다면 식당·카페를 가장 가까운 곳으로 미리 골라 둔다(완성된 일정과 예산을 바로 보여주기 위해)
  let changed = false;
  if (!STATE.eat_id && !STATE.meal_skip) { const n = nearestEat(place, '식당'); if (n) { STATE.eat_id = n.id; changed = true; } }
  if (!STATE.cafe_id && !STATE.cafe_skip) { const n = nearestEat(place, '카페'); if (n) { STATE.cafe_id = n.id; changed = true; } }
  if (changed) save();
}

const CAT_CLS = { '한식': 'kr', '일식': 'jp', '중식': 'cn', '양식': 'we', '카페': 'cafe' };
const CAT_ICON = { '한식': '🍚', '일식': '🍣', '중식': '🥟', '양식': '🍝', '카페': '☕', '이색 음식점': '🍽️' };
function distShort(e) { const d = e.distance || {}; return d.mode === 'in_park' ? '공원 안' : (typeof d.meters === 'number' ? (d.meters < 1000 ? d.meters + 'm' : (d.meters / 1000).toFixed(1) + 'km') : ''); }
function infraBadges(e) {   // 아기의자·유모차: 운영자 확인 항목(reviewed 카드) 또는 자동 수집 꿀팁(curation, reviewed:true & found:true)만 뱃지로 보인다
  const out = [], cu = e.curation || {}, inf = e.infra || {};
  if ((cu.high_chair && cu.high_chair.reviewed === true && cu.high_chair.found === true) || (inf.high_chair && inf.high_chair.v)) out.push('아기의자');
  if ((cu.stroller && cu.stroller.reviewed === true && cu.stroller.found === true) || (inf.stroller_access && inf.stroller_access.v)) out.push('유모차');
  return out;
}
function eatCard(e, on, onClick) {
  const b = h('button', 'ecard' + (on ? ' on' : '')); b.type = 'button'; b.setAttribute('aria-pressed', on ? 'true' : 'false');
  const cat = e.category || (e.kind === '카페' ? '카페' : '음식점');
  const ph = h('div', 'eph ' + (CAT_CLS[cat] || (e.kind === '카페' ? 'cafe' : '')));
  const url = e.photo && /^https:\/\//.test(e.photo.thumb || e.photo.url || '') ? (e.photo.thumb || e.photo.url) : '';
  const fallback = () => {   // 2순위: 대표메뉴·업종 키워드로 고른 손그림 -> 3순위: 이모지
    ph.classList.remove('photo'); const ar = window.BuygFood && BuygFood.art(e);
    const emo = () => h('span', '', (window.BuygFood && BuygFood.icon(e)) || CAT_ICON[cat] || (e.kind === '카페' ? '☕' : '🍽️'));
    if (ar) { ph.classList.add('art'); const im = document.createElement('img'); im.src = ar.src; im.alt = ar.label; im.loading = 'lazy'; im.onerror = () => { im.remove(); ph.classList.remove('art'); ph.insertBefore(emo(), ph.firstChild); }; ph.insertBefore(im, ph.firstChild); }
    else ph.insertBefore(emo(), ph.firstChild);
  };
  if (url) {   // 1순위: 출처 있는 실제 사진(비율이 달라도 잘리지 않게 contain + 흐린 배경)
    ph.classList.add('photo'); const mk = cls => { const im = document.createElement('img'); im.className = cls; im.src = url; im.alt = ''; im.loading = 'lazy'; im.referrerPolicy = 'no-referrer'; return im; };
    const bg = mk('bg'), fg = mk('fg'); fg.alt = e.name || ''; bg.setAttribute('aria-hidden', 'true');
    fg.onerror = () => { bg.remove(); fg.remove(); const cr = ph.querySelector('.ecr'); if (cr) cr.remove(); fallback(); };
    ph.appendChild(bg); ph.appendChild(fg); ph.appendChild(h('span', 'ecr', '© 한국관광공사'));
  } else fallback();
  const ds = distShort(e); if (ds) ph.appendChild(h('span', 'edist', ds)); ph.appendChild(h('span', 'echk', '✓')); b.appendChild(ph);
  const bd = h('div', 'ebd'); bd.appendChild(h('div', 'enm', e.name)); bd.appendChild(h('div', 'ecat', cat));
  const menu = (e.menu && e.menu.v) || (e.recommend_for && e.recommend_for.v) || ''; bd.appendChild(h('div', 'emn', menu ? '대표메뉴 ' + menu : '메뉴 정보 준비 중'));
  const kid = e.kid_menu_hint && e.kid_menu_hint.length ? e.kid_menu_hint.join('·') : ''; if (kid) bd.appendChild(h('div', 'ekid', '아이 메뉴 · ' + kid));
  const bg = h('div', 'ebdg'); const bs = infraBadges(e); bs.forEach(x => { const sp = h('span', 'bdg'); const fid = x === '아기의자' ? 'facility_highchair' : 'facility_stroller'; const im = document.createElement('img'); im.className = 'bdg-ic'; im.src = 'assets/img/icons/' + fid + '.webp'; im.alt = ''; im.width = 14; im.height = 14; im.onerror = () => im.remove(); sp.appendChild(im); sp.appendChild(document.createTextNode(x)); bg.appendChild(sp); }); if (!bs.length) bg.appendChild(h('span', 'unk', '아기의자·유모차 매장 확인 필요')); bd.appendChild(bg);
  b.appendChild(bd); b.addEventListener('click', onClick); return b;
}
function eatCarousel(list, selected, pick) {
  const wrap = h('div', 'ecar'); wrap.setAttribute('role', 'listbox');
  list.forEach(e => wrap.appendChild(eatCard(e, selected === e.id, () => pick(e))));
  return wrap;
}

function eatSub(b, e) {   // 식당·카페 선택 카드의 보조 문구: 목록형은 확인된 판매품목 + '매장 확인 필요', 후기형은 추천 대상·피크
  if (e.level === 'listed') { if (e.menu && e.menu.v) b.appendChild(h('span', '', e.menu.v)); b.appendChild(h('span', 'unk', '아기의자 · 주차 · 유모차 진입은 매장 확인 필요')); return; }
  if (e.recommend_for && e.recommend_for.v) b.appendChild(h('span', '', e.recommend_for.v));
  if (e.peak) b.appendChild(h('span', '', '붐비는 시간: ' + e.peak.label));
}


function toast(msg) { let el = $('.toast'); if (!el) { el = h('div', 'toast'); el.setAttribute('role', 'status'); document.body.appendChild(el); } el.textContent = msg; el.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(() => { el.style.display = 'none'; }, 2200); }
const WX = {};   // 'lat,lon,date' -> 예보(또는 {error})
function pinSvg() { return '<svg class="pin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#b5483a" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 10-14 0c0 5.8 7 12 7 12z" fill="#f6c9bf"/><circle cx="12" cy="10" r="2.4" fill="#fff"/></svg>'; }
function loadWeather(place, iso, box) {
  const geo = place.geo; const d = Planner.daysFrom(new Date(), iso);
  const show = (cls, icon, title, sub) => { box.className = 'wxbox ' + cls; box.innerHTML = ''; box.appendChild(h('div', 'wi', icon)); const w = h('div', 'wt'); w.appendChild(h('b', '', title)); if (sub) w.appendChild(h('span', '', sub)); box.appendChild(w); };
  if (!geo) return show('none', '🌡️', '날씨 정보를 불러올 수 없어요', '이 장소의 위치 정보가 아직 없어요.');
  if (!(d >= 0)) return show('none', '🗓️', '지난 날짜예요', '오늘 이후 날짜를 골라 주세요.');
  if (d > 15) return show('none', '🗓️', '아직 예보가 없어요', '날씨 예보는 오늘부터 16일 이내만 볼 수 있어요. 가까워지면 다시 확인해 주세요.');
  const key = geo.lat + ',' + geo.lon + ',' + iso;
  const draw = f => {
    if (!f || f.error) return show('none', '🌡️', '날씨 정보를 불러오지 못했어요', '잠시 후 다시 시도해 주세요.');
    const w = Planner.wmo(f.code), a = Planner.weatherAdvice(f, place.theme);
    show(a.tone === 'warn' ? 'warn' : '', w.icon, w.label + ' ' + Math.round(f.tmax) + '℃' + (isFinite(f.tmin) ? ' (최저 ' + Math.round(f.tmin) + '℃)' : '') + ' · ' + a.text.split(' · ')[0], (a.text.indexOf(' · ') > 0 ? a.text.split(' · ')[1] + ' · ' : '') + (typeof f.pop === 'number' ? '강수확률 ' + f.pop + '% · ' : '') + '예보 출처 Open-Meteo');
  };
  if (WX[key]) return draw(WX[key]);
  show('none', '⏳', '날씨를 확인하는 중…', '');
  fetch('https://api.open-meteo.com/v1/forecast?latitude=' + geo.lat + '&longitude=' + geo.lon + '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FSeoul&start_date=' + iso + '&end_date=' + iso)
    .then(r => r.json()).then(j => { const dd = j && j.daily; WX[key] = dd && dd.time && dd.time.length ? { code: dd.weather_code[0], tmax: dd.temperature_2m_max[0], tmin: dd.temperature_2m_min[0], pop: dd.precipitation_probability_max ? dd.precipitation_probability_max[0] : null } : { error: 1 }; })
    .catch(() => { WX[key] = { error: 1 }; }).then(() => { if (box.isConnected) draw(WX[key]); });
}
function planTitle(place) { return place.name + (STATE.visit_date ? ' · ' + Planner.dateLabel(STATE.visit_date) : ''); }
function shareUrl() { return location.origin + location.pathname + '?shared=true&s=' + Planner.encodePlan(STATE); }
function sharePlan(place) {
  const url = shareUrl(), title = '나의 주말 일정 · ' + planTitle(place), text = title + '\n(예상 합계는 링크에서 확인해요)';
  ga('plan_share', { id: place.id });
  if (navigator.share) { navigator.share({ title: title, text: text, url: url }).catch(() => { /* 사용자가 닫음 */ }); return; }
  const done = () => toast('링크를 복사했어요. 카카오톡에 붙여넣어 보내 보세요');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, () => prompt('아래 링크를 복사해 주세요', url));
  else prompt('아래 링크를 복사해 주세요', url);
}

const ICON = { place: '📍', stop: '🎭', meal: '🍽️', cafe: '☕', move: '🚗', wait: '⏱️', end: '🏠' };
function planSummary(r) { return { total: r.budget.total, unknown: r.budget.unknown.length }; }
function fmtDate(iso) { const d = iso ? new Date(iso) : null; return d && !isNaN(d) ? (d.getMonth() + 1) + '/' + d.getDate() : ''; }
function totalRow(r) { const d = h('div', 'dtotal'); const l = h('span'); l.appendChild(document.createTextNode('예상 합계')); l.appendChild(h('small', '', r.budget.unknown.length ? '확인 필요 ' + r.budget.unknown.length + '건은 제외' : (r.budget.estimate_total ? '요금 + 식비·카페비 추정치' : '확인된 요금 기준'))); d.appendChild(l); d.appendChild(h('strong', '', Planner.won(r.budget.total))); return d; }
// 추천 방문 시간 뱃지: 장소·식당·카페 데이터에 best_time{start,end,provenance|src,verified_at|checked,label}이 있을 때만(근거 없으면 숨김)
function bestTimeOf(place, ref) {

        inp.addEventListener('change', () => set(st => { const v = inp.value === '' ? null : Number(inp.value); st.manual[m[0]] = (v == null || !isFinite(v) || v < 0) ? null : Math.floor(v); })); w.appendChild(inp); s.appendChild(w); }); }
    const reset = h('button', 'ghost', '처음부터 다시 만들기'); reset.type = 'button'; reset.addEventListener('click', () => { if (confirm('저장된 일정을 지우고 처음부터 시작할까요?')) { Planner.clearPlan(); STATE = Planner.loadPlan(); render(); window.scrollTo(0, 0); } }); s.appendChild(reset);
    app.appendChild(s); }
  { // 안내 · 자주 묻는 질문 (페이지 맨 아래, 기본은 접힘)
    const s = h('section', 'step'); s.id = 'faqList'; const h2 = h('h2'); h2.appendChild(document.createTextNode('안내 · 자주 묻는 질문')); s.appendChild(h2);
    const checked = (place.facts && place.facts.address && place.facts.address.checked) || '';
    const Q = [
      ['예상 합계는 어떻게 계산하나요?', ['입장료·주차비는 각 장소 공식 안내를 ' + checked + ' 기준으로 확인한 값이에요. 요금은 바뀔 수 있으니 방문 전에 확인해 주세요.', '식비·카페비는 운영자가 확인한 대표메뉴 1종의 기준가 × 어른 인원수로 계산한 "예상치"예요. 직접 입력하면 입력한 금액이 우선 적용돼요.', '가격을 확인하지 못한 항목은 "확인 필요"로 두고 합계에 넣지 않아요.']],
      ['"매장 확인 필요"는 무슨 뜻이에요?', ['공식 출처로 이름·주소·판매품목만 확인한 곳이에요. 아기의자, 주차, 유모차 진입, 테이블 간격은 확인하지 못해서 방문 전에 매장에 문의해 주세요.']],
      ['이동 시간은 정확한가요?', ['확인된 이동 시간은 그대로 쓰고, 없는 경우 거리로 추정해요(공원 안은 도보 10분, 직선거리는 1km당 약 3분·최소 10분). 추정한 구간에는 "추정 시간"이 표시돼요. 실제 경로는 지도 앱으로 확인해 주세요.']],
      ['일정은 어디에 저장되나요?', ['로그인 없이 이 기기의 브라우저에만 저장돼요(상단 "보관함"에서 최대 10개). 다른 기기에서는 보이지 않고, "처음부터 다시 만들기"로 지울 수 있어요.', '공유하기 링크에는 장소·식당·인원·날짜 같은 일정 선택값만 담겨요. 받은 사람에게는 입력 화면 없이 일정표와 예상 금액만 보이고, "내 일정으로 복사해 수정하기"로 가져갈 수 있어요.']],
      ['날씨는 어디서 가져오나요?', ['Open-Meteo 예보를 방문 예정일 기준으로 보여드려요(오늘부터 16일 이내). 예보는 바뀔 수 있으니 출발 전에 다시 확인해 주세요.']],
      ['숙소는 어떻게 되나요?', ['지금은 당일치기 일정만 만들 수 있어요. 키즈 펜션·리조트 같은 숙소 연계는 정보를 확인하는 대로 추가할 예정이에요.']]
    ];
    Q.forEach(q => { const d = h('details', 'fq'); d.appendChild(h('summary', '', q[0])); const a = h('div', 'fa'); q[1].forEach(x => a.appendChild(h('p', '', x))); d.appendChild(a); d.addEventListener('toggle', () => { if (d.open) ga('plan_faq_open', { q: q[0].slice(0, 30) }); }); s.appendChild(d); });
    app.appendChild(s); }
  renderBar(r); updateBox();
  window.scrollTo(0, keepY);
}
function renderBar(r) {
  const old = $('.bar'); if (old) old.remove(); const bar = h('div', 'bar'), inn = h('div', 'bar-in'), sum = h('div', 'sum');
  if (r) { sum.appendChild(document.createTextNode('예상 합계')); sum.appendChild(h('b', '', Planner.won(r.budget.total) + (r.budget.unknown.length ? ' + 확인 필요 ' + r.budget.unknown.length + '건' : ''))); }
  else sum.appendChild(document.createTextNode('장소를 선택해 주세요'));
  inn.appendChild(sum); if (r) { const g = h('a', 'go', '일정 보기'); g.href = '#result'; g.addEventListener('click', e => { e.preventDefault(); $('#result').scrollIntoView({ behavior: 'smooth', block: 'start' }); ga('plan_view_result'); }); inn.appendChild(g); }
  bar.appendChild(inn); document.body.appendChild(bar);
}
(async function () {
  $('#back').addEventListener('click', () => { if (history.length > 1) history.back(); else location.href = 'outing.html'; });
  try { const r = await fetch('./place_guides.json', { cache: 'no-store' }); GUIDES = (await r.json()).places || {}; } catch (e) { GUIDES = {}; }
  try { const r = await fetch('./free_spots_seed.json'); ((await r.json()).spots || []).forEach(s => { SEEDS[s.id] = s; }); } catch (e) { SEEDS = {}; }
  try { const r = await fetch('./spot_enriched.json'); ENR = (await r.json()).spots || {}; } catch (e) { ENR = {}; }
  { const qq = new URLSearchParams(location.search).get('place'); ensureSeedPlace(qq); ensureSeedPlace(STATE.place_id); const sq = new URLSearchParams(location.search).get('s'); const dd = sq && Planner.decodePlan(sq); if (dd) ensureSeedPlace(dd.place_id); }
  const q = new URLSearchParams(location.search).get('place');
  if (q && GUIDES[q] && GUIDES[q].costs && STATE.place_id !== q) { STATE.place_id = q; STATE.eat_id = null; STATE.cafe_id = null; STATE.extra_stop = null; STATE.meal_skip = false; STATE.cafe_skip = false; STATE.extras.theme_garden = false; save(); }
  { const sk = new URLSearchParams(location.search).get('stop'); if (q && sk && GUIDES[q] && STATE.place_id === q) { const xs = await resolveStop(sk, GUIDES[q]); if (xs) { STATE.extra_stop = xs; save(); } } }
  const sp = new URLSearchParams(location.search).get('s');
  if (sp) { const got = Planner.decodePlan(sp); const gp = got && GUIDES[got.place_id]; if (gp && gp.costs) { renderShared(got, gp); return; } try { history.replaceState(null, '', location.pathname); } catch (e) { /* 무시 */ } toast('공유 링크를 열 수 없어 내 일정을 보여드려요'); }
  if (STATE.place_id && !(GUIDES[STATE.place_id] && GUIDES[STATE.place_id].costs)) STATE.place_id = '';
  if (!STATE.visit_date) { STATE.visit_date = Planner.nextSaturday(new Date()); save(); }
  $('#boxBtn').addEventListener('click', () => openDrawer());
  updateBox();
  render();
})();
