<!--
  지역/체험 공구 지도 탭 프로토타입 (2026-10-03, 독립 파일 - 서비스 index.html과 무관).
  데이터: 같은 폴더의 experience_deals.json -> 없으면 배포된 사이트의 최신 파일.
  ?demo=1 을 붙이면 빈 지역 확인용 [샘플] 데이터를 섞어 보여준다.
  지도는 실제 경계 대신 배치만 따른 단순화 벡터다 - 서울·인천·대전처럼 작은 지역도
  모바일에서 손가락으로 누를 수 있게 면적을 키웠다.
-->
<style>
  :root {
    --brand-purple: #5f0080;
    --accent-lavender: #ede5f3;
    --point-coral: #E03E3E;
    --point-coral-bg: rgba(224, 62, 62, 0.08);
    --text-main: #222;
    --text-sub: #94a3b8;
    --line: #f0f0f0;
    --bg: #f8f9fa;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text-main);
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
  .app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: #fff; padding-bottom: 24px; }
  header { position: relative; padding: calc(18px + env(safe-area-inset-top, 0px)) 20px 6px; }
  .logo { font-size: 18px; font-weight: 800; color: var(--brand-purple); }
  /* 360px 폭에서도 한 줄에 들어가는 크기, 한국어는 어절 단위로만 줄바꿈 */
  .title { margin: 12px 0 0; font-size: clamp(21px, 6vw, 24px); line-height: 1.3; font-weight: 800; letter-spacing: -0.3px; word-break: keep-all; }
  .sub { margin: 6px 0 0; font-size: 13px; line-height: 1.5; color: #7a8394; word-break: keep-all; text-wrap: balance; }

  .tabs { display: flex; gap: 6px; padding: 16px 16px 4px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 1; padding: 11px 8px; border-radius: 14px; border: 1.5px solid #eee; background: #fff;
    font-size: 14px; font-weight: 800; color: #64748b; cursor: pointer; font-family: inherit;
  }
  .tab .n { margin-left: 4px; font-size: 12px; font-weight: 700; color: var(--text-sub); }
  .tab.active { border-color: var(--brand-purple); background: var(--brand-purple); color: #fff; }
  .tab.active .n { color: #e9d5f5; }

  .extra { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 16px 0; }
  .pill {
    font-size: 12px; font-weight: 700; padding: 6px 10px; border-radius: 999px; cursor: pointer;
    background: var(--point-coral-bg); color: var(--point-coral); border: none; font-family: inherit;
  }
  .pill.muted { background: #f1f5f9; color: #64748b; }

  .map-wrap { padding: 4px 12px 0; position: relative; }
  svg { width: 100%; height: auto; display: block; touch-action: manipulation; }
  .region path, .region ellipse, .region rect {
    fill: #f3eef7; stroke: #fff; stroke-width: 2.5; transition: fill .15s ease; cursor: pointer;
  }
  .region.has path, .region.has ellipse, .region.has rect { fill: #e4d3ef; }
  .region.hot path, .region.hot ellipse, .region.hot rect { fill: #d2b6e6; }
  .region.selected path, .region.selected ellipse, .region.selected rect { fill: var(--brand-purple); }
  .region:active path, .region:active ellipse, .region:active rect { fill: #c39ddc; }
  .region text.name { font-size: 10.5px; font-weight: 700; fill: #6b5a78; pointer-events: none; text-anchor: middle; }
  .region.selected text.name { fill: #fff; }
  .badge circle { fill: var(--point-coral); stroke: #fff; stroke-width: 2; }
  .badge text { font-size: 10px; font-weight: 800; fill: #fff; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .badge { pointer-events: none; }
  .legend { padding: 4px 16px 0; font-size: 11px; color: var(--text-sub); }
  .empty-msg { padding: 10px 16px; font-size: 12.5px; color: #777; }

  /* ---- 바텀 시트 ---- */
  .backdrop { position: fixed; inset: 0; height: 100vh; height: 100dvh; background: rgba(15,23,42,.45); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 40; }
  .backdrop.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; margin: 0 auto; width: 100%; max-width: 480px; z-index: 41;
    /* 모바일 주소창·하단 툴바가 보였다 사라져도 시트가 툴바 뒤로 숨지 않게 동적 뷰포트(dvh) 기준, 미지원 브라우저는 vh */
    max-height: calc(100vh - 72px); max-height: calc(100dvh - 72px); display: flex; flex-direction: column; background: #fff;
    border-radius: 20px 20px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.18);
    transform: translateY(100%); visibility: hidden;
    transition: transform .32s cubic-bezier(.2,.8,.2,1), visibility 0s linear .32s;
  }
  .sheet.show { transform: translateY(0); visibility: visible; transition: transform .32s cubic-bezier(.2,.8,.2,1); }
  .sheet-head { position: relative; padding: 14px 16px 10px; border-bottom: 1px solid #f4f4f5; }
  .grabber { position: absolute; top: 6px; left: 50%; width: 40px; height: 4px; margin-left: -20px; border-radius: 2px; background: #e2e8f0; }
  .sheet-title { font-size: 16px; font-weight: 800; margin-top: 4px; }
  .sheet-sub { font-size: 12px; color: var(--text-sub); margin-top: 2px; }
  .close { position: absolute; top: 10px; right: 12px; width: 32px; height: 32px; border: none; border-radius: 50%; background: #f1f5f9; font-size: 15px; cursor: pointer; }
  .sheet-list { overflow-y: auto; overscroll-behavior: contain; padding: 10px 16px calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px; }
  .card { display: flex; gap: 12px; padding: 10px; border: 1px solid var(--line); border-radius: 14px; text-decoration: none; color: inherit; }
  .card:active { background: #fafafa; }
  .thumb { flex: 0 0 80px; width: 80px; height: 80px; border-radius: 12px; overflow: hidden; background: var(--accent-lavender); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .row1 { display: flex; gap: 6px; align-items: center; min-width: 0; }
  .dday { flex: 0 0 auto; font-size: 10.5px; font-weight: 800; padding: 2px 7px; border-radius: 6px; background: #f1f5f9; color: #64748b; }
  .dday.hot { background: var(--point-coral-bg); color: var(--point-coral); }
  .name { font-size: 13.5px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .place { font-size: 12px; color: #64748b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .handle { font-size: 11px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .price { font-size: 13px; font-weight: 600; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55%; }
  .chip { font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--point-coral-bg); color: var(--point-coral); white-space: nowrap; }
  .sample { flex: 0 0 auto; white-space: nowrap; font-size: 10px; font-weight: 700; color: #fff; background: #94a3b8; padding: 1px 5px; border-radius: 4px; }
  .empty-card { margin: 8px 0 4px; padding: 26px 18px 22px; border-radius: 16px; background: var(--bg); text-align: center; }
  .empty-icon { font-size: 34px; line-height: 1; }
  .empty-title { margin-top: 12px; font-size: 15px; font-weight: 800; line-height: 1.45; word-break: keep-all; }
  .empty-sub { margin-top: 6px; font-size: 12.5px; color: #7a8394; line-height: 1.5; word-break: keep-all; }
  .empty-cta {
    margin-top: 16px; padding: 11px 16px; border: none; border-radius: 12px; cursor: pointer; font-family: inherit;
    background: var(--point-coral-bg); color: var(--point-coral); font-size: 13.5px; font-weight: 800;
  }
  /* ---- 무료 나들이 섹션 (공구와 함께 보여주는 하이브리드) ---- */
  .free-head { margin: 16px 0 2px; }
  .free-head h3 { margin: 0; font-size: 14.5px; font-weight: 800; }
  .free-head span { display: block; margin-top: 2px; font-size: 11px; color: var(--text-sub); }
  .no-deal-note {
    padding: 12px 14px; border-radius: 14px; background: #f3faf6; color: #2f6b49;
    font-size: 13px; font-weight: 700; line-height: 1.5; word-break: keep-all;
  }
  .no-deal-note .empty-cta { display: block; margin: 10px 0 0; width: 100%; }
  .spot { display: flex; align-items: center; gap: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 14px; text-decoration: none; color: inherit; }
  .spot:active { background: #fafafa; }
  .spot-icon { flex: 0 0 38px; width: 38px; height: 38px; border-radius: 12px; background: #eef7f1; display: flex; align-items: center; justify-content: center; font-size: 21px; }
  .spot-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .spot-title { font-size: 13.5px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .spot-meta { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .spot-addr { min-width: 0; font-size: 11.5px; color: #7a8394; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .spot-tag { flex: 0 0 auto; font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: #e8f5ee; color: #2f7d4f; white-space: nowrap; }
  .spot-tag.warn { background: #f1f5f9; color: #64748b; }
  /* 한국관광공사 TourAPI 무료 행사·축제 카드 (제목은 공공누리 3유형(변경금지)에 따라 원문 그대로 표시) */
  .ev { align-items: flex-start; }
  .ev .spot-icon { background: #f6effb; }
  .ev .spot-title { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.35; }
  .ev .spot-meta { flex-wrap: wrap; row-gap: 4px; }
  .ev-date { flex: 0 0 auto; font-size: 10.5px; font-weight: 800; padding: 2px 7px; border-radius: 6px; background: #f3ecfa; color: #5f0080; white-space: nowrap; }
  .ev-date.ing { background: #e8f5ee; color: #2f7d4f; }
  .ev-date.soon { background: #fff1ec; color: #c2410c; }
  .ev-kid { flex: 0 0 auto; font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: #fff8e1; color: #92620a; white-space: nowrap; }
  .map-footer .mf-source { margin: 0 0 8px; font-size: 12px; color: #777; }

  /* ==== [메인 홈 이식용] 주말 나들이 지도 바로가기 배너 ====
     index.html 최상단(공지 띠배너 아래, 로고 위)에 그대로 붙이는 컴포넌트.
     마크업은 아래 데모 영역의 <a class="trip-banner"> 그대로, href만 지도 페이지 경로로 바꾼다. */
  .trip-banner {
    display: flex; align-items: center; gap: 12px; margin: 0 16px; padding: 14px 14px 14px 12px;
    border-radius: 18px; text-decoration: none; color: var(--text-main);
    background: linear-gradient(135deg, #f4ecfa 0%, #fdf1f1 100%); border: 1px solid #efe3f6;
  }
  .trip-banner:active { transform: scale(0.99); }
  .trip-banner-icon {
    flex: 0 0 46px; width: 46px; height: 46px; border-radius: 14px; background: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 2px 8px rgba(95,0,128,.08);
  }
  .trip-banner-text { flex: 1; min-width: 0; }
  .trip-banner-title { display: block; font-size: 14.5px; font-weight: 800; letter-spacing: -0.2px; word-break: keep-all; }
  .trip-banner-sub { display: block; margin-top: 3px; font-size: 12px; font-weight: 700; color: var(--point-coral); }
  .trip-banner-arrow { flex: 0 0 auto; font-size: 20px; color: #b49ac7; }
  .demo-caption { margin: 14px 16px 6px; font-size: 10.5px; font-weight: 700; color: #b0b8c4; letter-spacing: .2px; }
  /* ---- 📍 내 주변 버튼 / 토스트 ---- */
  .locate-btn {
    position: absolute; top: 2px; right: 16px; z-index: 5;
    font-size: 11px; font-weight: 800; padding: 4px 8px; border-radius: 999px; cursor: pointer; font-family: inherit;
    background: #fff; color: var(--brand-purple); border: 0; box-shadow: 0 2px 8px rgba(0,0,0,.18);
  }
  .locate-btn:active { transform: scale(.96); }
  .spot-badges { display: flex; flex-wrap: nowrap; overflow: hidden; gap: 3px; margin-top: 4px; }
  .sb { flex: 0 0 auto; font-size: 9.5px; font-weight: 700; padding: 2px 4px; border-radius: 6px; background: #f1f5f9; color: #475569; white-space: nowrap; }
  .sb.park { background: #eaf2ff; color: #2563eb; }
  .sb.baby { background: #fff0f3; color: #e0476b; }
  .locate-btn[disabled] { opacity: .55; cursor: default; }
  .map-toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 60;
    transform: translate(-50%, 12px); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
    width: max-content; max-width: calc(100vw - 32px); padding: 11px 14px; border-radius: 12px;
    background: rgba(30,41,59,.94); color: #fff; font-size: 12.5px; font-weight: 600; line-height: 1.45; text-align: center; word-break: keep-all;
  }
  .map-toast.show { opacity: 1; transform: translate(-50%, 0); }
  /* ---- 바텀시트 세부 지역 칩 (가로 스크롤) ---- */
  .sub-chips {
    display: flex; gap: 6px; overflow-x: auto; margin: 10px -16px 0; padding: 0 16px 2px;
    scrollbar-width: none; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; scroll-snap-type: x proximity;
  }
  .sub-chips::-webkit-scrollbar { display: none; }
  .sub-chip {
    flex: 0 0 auto; scroll-snap-align: start; padding: 6px 12px; border-radius: 999px; border: 1px solid #e5e7eb;
    background: #fff; font-size: 12.5px; font-weight: 700; color: #475569; cursor: pointer; font-family: inherit; white-space: nowrap;
  }
  .sub-chip .n { margin-left: 3px; font-size: 11px; color: var(--text-sub); font-weight: 600; }
  .sub-chip.active { background: var(--brand-purple); border-color: var(--brand-purple); color: #fff; }
  .sub-chip.active .n { color: #e9d5f5; }
  body.sheet-open { overflow: hidden; } /* 시트 스크롤 중 뒤 지도 페이지가 같이 밀리지 않게 */
  .status { padding: 8px 16px 0; font-size: 11px; color: var(--text-sub); }
  /* ---- 새로고침 버튼 + 당겨서 새로고침 ---- */
  html, body { overscroll-behavior-y: contain; }
  .refresh-btn {
    position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: 14px; z-index: 30;
    width: 34px; height: 34px; border-radius: 50%; border: 0; background: #f3effa; color: var(--brand-purple);
    font-size: 18px; line-height: 1; cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: center;
  }
  .refresh-btn:active { background: #e6dcf3; }
  .refresh-btn span { display: block; transition: transform .6s ease; }
  .refresh-btn.spin span { transform: rotate(360deg); }
  .ptr {
    position: fixed; top: calc(8px + env(safe-area-inset-top, 0px)); left: 50%; z-index: 70; width: 34px; height: 34px; margin-left: -17px;
    border-radius: 50%; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.2); display: flex; align-items: center; justify-content: center;
    opacity: 0; transform: translateY(-60px); pointer-events: none;
  }
  .ptr i { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid #e6dcf3; border-top-color: var(--brand-purple); display: block; }
  .ptr.loading i { animation: ptrspin .7s linear infinite; }
  @keyframes ptrspin { to { transform: rotate(360deg); } }
  /* ================= 공구 상세 바텀시트 / PC 중앙 모달 ================= */
  .deal-backdrop {
    position: fixed; inset: 0; z-index: 400; background: rgba(15,23,42,0.45);
    opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
  }
  .deal-backdrop.show { opacity: 1; pointer-events: auto; }
  .deal-sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 401; margin: 0 auto;
    width: 100%; max-width: 480px; max-height: 92vh; max-height: 92dvh;
    display: flex; flex-direction: column; background: #fff; border-radius: 20px 20px 0 0;
    box-shadow: 0 -8px 30px rgba(0,0,0,0.18);
    transform: translateY(100%); visibility: hidden;
    transition: transform 0.32s cubic-bezier(0.2, 0.8, 0.2, 1), visibility 0s linear 0.32s;
  }
  .deal-sheet.show { transform: translateY(0); visibility: visible; transition: transform 0.32s cubic-bezier(0.2, 0.8, 0.2, 1); }
  @media (min-width: 640px) {
    .deal-sheet {
      top: 50%; bottom: auto; left: 50%; right: auto; width: 480px; max-height: 88vh;
      border-radius: 20px; opacity: 0; transform: translate(-50%, -46%);
      transition: transform 0.22s ease, opacity 0.22s ease, visibility 0s linear 0.22s;
    }
    .deal-sheet.show { opacity: 1; transform: translate(-50%, -50%); transition: transform 0.22s ease, opacity 0.22s ease; }
    .deal-grabber { display: none; }
  }
  .deal-head { position: relative; flex: 0 0 auto; height: 44px; }
  .deal-grabber { position: absolute; top: 8px; left: 50%; width: 40px; height: 4px; margin-left: -20px; border-radius: 2px; background: #e2e8f0; }
  .deal-close {
    position: absolute; top: 6px; right: 10px; width: 32px; height: 32px; border: none; border-radius: 50%;
    background: #f1f5f9; color: #334155; font-size: 15px; cursor: pointer; padding: 0;
  }

// ---- GA4 (본 사이트 view_page.html의 sendGaEvent/trackOutbound와 같은 이름·파라미터 규격) ----
// gtag가 없거나(로컬, 광고차단) 실패해도 화면 동작은 그대로 진행한다.
function sendGaEvent(name, params) {
  if (typeof window.gtag !== 'function') return;
  try { window.gtag('event', name, params); } catch (e) { /* 추적 실패 무시 */ }
}
function gaDealParams(d) {
  return { influencer: (d.influencer_handle || '').slice(0, 100), product_title: (d.product_name || '').slice(0, 100) };
}
function trackOutbound(d, url, source) {
  const p = gaDealParams(d);
  p.link_target = /^https?:\/\/(www\.)?instagram\.com\//i.test(url || '') ? 'instagram' : 'external';
  p.link_source = source;
  sendGaEvent('outbound_click', p);
}

function subOfSpot(sp) {
  const t = (sp.address || '').split(/\s+/);
  if (METROS.includes(t[0])) return t[0];
  const raw = t[1] || '';
  const name = raw.replace(/(특별자치시|시|군|구)$/, '');
  return name.length >= 2 ? name : (raw || '기타');
}
function subOfDeal(d) {
  const text = (d.place_name || '') + ' ' + (d.product_name || '');
  const alias = Object.keys(SUB_ALIAS).sort((a, b) => b.length - a.length).find(k => text.includes(k));
  if (alias) return SUB_ALIAS[alias];
  const city = SUB_CITIES.find(c => text.includes(c));
  return city || '기타';
}

function themeSpots() { const t = THEMES.find(x => x.key === theme); return t ? freeSpots.filter(t.ok) : freeSpots; }

let selected = null;

// toISOString()은 UTC라 한국 시간 자정 기준 날짜가 하루 밀린다 - 로컬 날짜로 만든다
function localIso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function parseDate(s) { return s ? new Date(s + 'T00:00:00') : null; }
function isLive(d) { const end = parseDate(d.end_date) || parseDate(d.start_date); return !end || end >= TODAY; }
function subOf(d) { return d.sub_category === 'stay' ? 'stay' : 'play'; } // 미분류는 체험 쪽으로
function ddayLabel(d) {
  const start = parseDate(d.start_date), end = parseDate(d.end_date);
  if (start && start > TODAY) return { t: 'D-' + Math.round((start - TODAY) / 864e5) + ' 오픈', hot: false };
  if (!end) return { t: '진행중', hot: false };
  const left = Math.round((end - TODAY) / 864e5);
  return left === 0 ? { t: '오늘마감!', hot: true } : { t: 'D-' + left, hot: left <= 2 };
}
function priceText(d) {
  const p = (d.price || '').trim();
  return /[\d,]+\s*(만|천)?\s*원/.test(p) ? p : '';
}

    make('제주', 'stay', '제주 키즈 리조트', '제주 키즈 리조트 2박 패키지', '359,000원', 10),

async function loadDeals() {
  for (const url of DATA_URLS) {
    try {
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) continue;
      const json = await res.json();
      document.getElementById('status').textContent =
        '데이터: ' + (url.startsWith('http') ? '배포 사이트' : '로컬 파일') + ' · 생성 ' + (json.generated_at || '-');
      return (json.deals || []);
    } catch (e) { /* 다음 경로 시도 (file:// 로 열면 로컬 fetch가 막힘) */ }
  }
  document.getElementById('status').textContent = '데이터를 불러오지 못했어요 (로컬 서버로 열어 주세요)';
  return [];
}

function countsFor(sub) {
  const counts = {};
  if (sub === 'show') {
    shows.forEach(p => { const g = REGION_GROUP[p.region]; if (g) counts[g] = (counts[g] || 0) + 1; });
    return counts;
  }
  if (sub === 'festival') {
    tourAll().forEach(e => { const g = REGION_GROUP[e.region]; counts[g] = (counts[g] || 0) + 1; });
    return counts;
  }
  if (themeActive()) {
    themeSpots().forEach(sp => { counts[sp.region] = (counts[sp.region] || 0) + 1; });
    return counts;
  }
  if (sub !== 'free') deals.filter(d => subMatch(d) && REGION_GROUP[d.region]).forEach(d => {
    const g = REGION_GROUP[d.region]; counts[g] = (counts[g] || 0) + 1;
  });
  if (sub === 'all' || sub === 'free') freeSpots.forEach(sp => { counts[sp.region] = (counts[sp.region] || 0) + 1; });
  return counts;
}

function render() {
  const counts = countsFor(activeSub);
  const max = Math.max(1, ...Object.values(counts));
  document.querySelectorAll('.region').forEach(g => {
    const n = counts[g.dataset.region] || 0;
    g.classList.toggle('has', n > 0);
    g.classList.toggle('hot', n > 0 && n >= Math.max(2, max * 0.6));
    g.classList.toggle('selected', g.dataset.region === selected);
  });
  // 건수 뱃지: 각 영역의 이름 라벨 오른쪽 위
  const badges = document.getElementById('badges');
  badges.innerHTML = '';
  document.querySelectorAll('.region').forEach(g => {
    const n = counts[g.dataset.region];
    if (!n) return;
    const label = g.querySelector('text.name');
    const x = +label.getAttribute("x") + label.getComputedTextLength() / 2 + 11;
    const y = +label.getAttribute("y") - 11;
    badges.insertAdjacentHTML('beforeend',
      `<g class="badge"><circle cx="${x}" cy="${y}" r="9"/><text x="${x}" y="${y}">${n}</text></g>`);
  });

  // 지도에 못 올리는 공구: 전국 이용권 (지역 미상은 로드 단계에서 이미 제외됨)
  const extra = document.getElementById('extra');
  extra.innerHTML = '';
  const noExtra = activeSub === 'show' || activeSub === 'free' || activeSub === 'festival' || themeActive();
  const nation = noExtra ? [] : deals.filter(d => subMatch(d) && d.region === '전국');
  if (nation.length) extra.insertAdjacentHTML('beforeend', `<button class="pill" data-extra="전국">🗺️ 전국 이용권 ${nation.length}</button>`);
  extra.querySelectorAll('.pill').forEach(b => b.addEventListener('click', () => {
    sendGaEvent('map_region_click', { map_region: b.dataset.extra, deal_count: listFor(b.dataset.extra).length });
    openSheet(b.dataset.extra);
  }));

  const total = Object.values(counts).reduce((a, b) => a + b, 0) + nation.length;
  const msg = document.getElementById('emptyMsg');
  msg.hidden = total > 0;
  msg.textContent = activeSub === 'show' ? '지금 진행·예정인 어린이 공연이 없어요.' : activeSub === 'festival' ? '지금 진행·예정인 행사·축제가 없어요.' : themeActive() ? '이 테마에 맞는 나들이 장소가 아직 없어요.' : activeSub === 'stay' ? '지금 진행 중인 숙소·여행 공구가 없어요.' : activeSub === 'play' ? '지금 진행 중인 키카·체험 공구가 없어요.' : '지금 표시할 공구·나들이 정보가 없어요.';
}

function listFor(key) {
  return deals.filter(d => subMatch(d) && (
    key === '전국' ? d.region === '전국'
        : REGION_GROUP[d.region] === key))
    .sort((a, b) => (a.end_date || '9999').localeCompare(b.end_date || '9999'));
}

let sheetKey = null;
let sheetSubFilter = '전체';

const isDesktop = () => window.matchMedia('(min-width: 900px)').matches;
function openSheet(key) {
  sheetKey = key;
  if (window.wxSetRegion) window.wxSetRegion(key);
  sheetSubFilter = '전체';
  selected = key === '전국' ? null : key;
  render();
  renderSubChips();
  renderSheetBody();
  const sheet = document.getElementById('sheet');
  // 시트가 이미 열린 채 내용만 바뀌는 경우(빈 지역 -> 전국 이용권)엔 뒤로가기 한 번에 닫히도록 히스토리를 더 쌓지 않는다
  if (!sheet.classList.contains('show') && !isDesktop()) history.pushState({ mapSheet: 1 }, '');
  document.getElementById('backdrop').classList.add('show');
  sheet.classList.add('show');
  document.body.classList.add('sheet-open');
}

// 권역 안에 실제로 공구/무료스팟이 있는 세부 지역만 칩으로 만든다(빈 화면 방지). 2곳 미만이면 숨김.
function renderSubChips() {
  const box = document.getElementById('subChips');
  box.innerHTML = '';
  const key = sheetKey;
  if (key === '전국' || activeSub === 'show' || activeSub === 'festival' || themeActive()) { box.hidden = true; return; }
  const counts = {};
  listFor(key).forEach(d => { const k = subOfDeal(d); counts[k] = (counts[k] || 0) + 1; });
  freeSpots.filter(sp => sp.region === key).forEach(sp => { const k = subOfSpot(sp); counts[k] = (counts[k] || 0) + 1; });
  const names = Object.keys(counts).sort((a, b) => (a === '기타') - (b === '기타') || counts[b] - counts[a] || a.localeCompare(b));

// 긴 상품명 정리: "A (옵션 나열...) / A' (옵션...)" 같은 이름에서 핵심만 남긴다(원문은 상세의 '구성'에 그대로).
function displayTitle(name) {
  var orig = String(name || '').trim();
  var t = orig.split(/\s+\/\s+/)[0];
  t = t.replace(/\([^)]{15,}\)/g, '').replace(/\[[^\]]{15,}\]/g, '').replace(/\s{2,}/g, ' ').trim();
  var toks = t.split(' '), out = [];
  toks.forEach(function (w) { if (!out.length || out[out.length - 1] !== w) out.push(w); });
  t = out.join(' ').trim();
  if (!t) t = orig;
  if (t.length > 50) { var cut = t.slice(0, 50), sp = cut.lastIndexOf(' '); t = (sp > 25 ? cut.slice(0, sp) : cut) + '…'; }
  return t;
}

// 이미지를 못 구한 공구(Buyg 기본 로고 URL/빈 값)는 구분 색 + 이모지 타일로 대신 그린다.

async function copyText(text) {
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; } } catch (err) { /* 아래 폴백 */ }
  try {
    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';

async function sharePlace(info) {

// 작은 광역시(서울·인천·대전/세종)는 대략적인 경계 박스로 먼저 판정하고, 나머지는 권역 중심점과의 거리로 고른다.
const REGION_CENTERS = {
  '경기': [37.41, 127.25], '강원': [37.75, 128.25], '충북': [36.75, 127.75], '충남': [36.55, 126.85],
  '전북': [35.75, 127.15], '전남/광주': [34.95, 126.95], '경북/대구': [36.3, 128.75], '경남/부산/울산': [35.3, 128.65], '제주': [33.4, 126.55],
};
function detectRegion(lat, lng) {
  if (lat < 33.7) return '제주';
  // 경계 박스는 근사치라 시 경계 바로 근처(부천·김포·과천 등)는 이웃 권역으로 잡힐 수 있다
  if (lat >= 37.43 && lat <= 37.70 && lng >= 126.80 && lng <= 127.18) return '서울';
  if (lat >= 37.35 && lat <= 37.58 && lng < 126.76) return '인천';
  if (lat >= 36.19 && lat <= 36.50 && lng >= 127.25 && lng <= 127.56) return '대전/세종'; // 대전
  if (lat >= 36.43 && lat <= 36.73 && lng >= 127.13 && lng <= 127.38) return '대전/세종'; // 세종 (바로 동쪽 청주와 겹치지 않게)
  let best = null, bestD = Infinity;
  Object.entries(REGION_CENTERS).forEach(([r, [la, ln]]) => {
    const d = (lat - la) ** 2 + ((lng - ln) * Math.cos(lat * Math.PI / 180)) ** 2;
    if (d < bestD) { bestD = d; best = r; }
  });
  return best;
}

}

  if (qtabBtn) qtabBtn.click();
  render(); renderThemeChips();
  // 데스크톱 Split View: 왼쪽 패널이 비어 보이지 않게 데이터가 가장 많은 지역을 먼저 열어 둔다
  if (isDesktop()) {
    const counts = countsFor(activeSub);
    const top = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];
    if (top) openSheet(top);
  }
  if (qplace) {   // 홈 '찜한 공구' 탭의 장소 카드에서 들어온 경우 상세 시트를 바로 연다
    const ev = tourEvents.find(x => x.id === qplace), sp = freeSpots.find(x => x.id === qplace);
    if (ev) openPlaceDetail(eventInfo(ev)); else if (sp) openPlaceDetail(spotInfo(sp));
  }
})();
</script>
<script>
// ---------------- 지도 위 날씨 카드: 선택한 지역 기준 이번 주말 예보 (Open-Meteo) ----------------
// 지역을 고르면(openSheet/closeSheet 훅) 그 지역 대표 좌표의 예보로 카드가 바뀐다. 지역별 30분 로컬 캐싱 +
// 같은 지역 동시 요청 합치기로 빠르게 번갈아 눌러도 API 호출이 낭비되지 않는다. 예보 실패 시 카드는 숨긴다.
(function () {
  const card = document.getElementById('wxCard');
  const src = document.getElementById('wxSrc');
  const sheetWx = document.getElementById('sheetWx');
  if (!card) return;
  const DEFAULT_REGION = '서울';
  // 지도 권역 -> [카드에 보일 이름, 위도, 경도]
  const COORD = {
    '서울': ['서울', 37.57, 126.98], '경기': ['경기', 37.41, 127.15], '인천': ['인천', 37.46, 126.71],
    '강원': ['강원', 37.88, 127.73], '충북': ['충북', 36.64, 127.49], '충남': ['충남', 36.66, 126.67],
    '대전/세종': ['대전·세종', 36.35, 127.38], '경북/대구': ['대구·경북', 35.87, 128.60], '전북': ['전북', 35.82, 127.15],
    '경남/부산/울산': ['부산·경남', 35.18, 129.08], '전남/광주': ['광주·전남', 35.16, 126.85], '제주': ['제주', 33.50, 126.53],
  };
  const TTL = 30 * 60 * 1000;
  const inflight = {};
  let current = DEFAULT_REGION, pick = null, token = 0, sheetRegion = null;

  function cacheGet(region) {
    try {
      const c = JSON.parse(localStorage.getItem('buygWx:' + region) || 'null');
      if (c && Date.now() - c.t < TTL) return c.daily;
    } catch (e) {}
    return null;
  }
  function cacheSet(region, daily) { try { localStorage.setItem('buygWx:' + region, JSON.stringify({ t: Date.now(), daily: daily })); } catch (e) {} }
  function load(region) {
    const hit = cacheGet(region);
    if (hit) return Promise.resolve(hit);
    if (inflight[region]) return inflight[region];
    const c = COORD[region];
    const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + c[1] + '&longitude=' + c[2]
      + '&daily=weather_code,precipitation_probability_max&timezone=Asia%2FSeoul&forecast_days=7';
    inflight[region] = fetch(url).then(function (r) { return r.ok ? r.json() : Promise.reject(); }).then(function (j) {
      if (!j || !j.daily || !j.daily.time) return Promise.reject();
      cacheSet(region, j.daily);
      return j.daily;
    }).then(function (d) { delete inflight[region]; return d; }, function (e) { delete inflight[region]; throw e; });
    return inflight[region];
  }
  function weekendStats(daily) {
    const days = [];
    for (let i = 0; i < daily.time.length; i++) {
      const dow = new Date(daily.time[i] + 'T00:00:00').getDay();
      if (dow === 6 || dow === 0) days.push(i);
      if (days.length === 2) break;
    }
    if (!days.length) return null;
    let rain = 0, code = 0;
    days.forEach(function (i) { rain = Math.max(rain, daily.precipitation_probability_max[i] || 0); code = Math.max(code, daily.weather_code[i] || 0); });
    return { rain: rain, wet: code >= 51, clear: code <= 1 };
  }
  function summarize(daily, region) {
    const w = weekendStats(daily);
    if (!w) return null;
    const name = COORD[region][0];
    if (w.wet || w.rain >= 50) return { region: region, ico: '☔', cond: '비 소식', state: name + ' 비 소식', tip: '실내 추천', key: 'indoor' };
    if (w.rain < 30) return { region: region, ico: w.clear ? '☀️' : '🌤️', cond: w.clear ? '맑음' : '구름 조금', state: name + (w.clear ? ' 맑음' : ' 구름 조금'), tip: '야외 추천', key: 'outdoor' };
    return { region: region, ico: '⛅', cond: '흐림', state: name + ' 흐림', tip: '우산 챙기세요', key: '' };
  }
  function render() {
    renderSheetChip();
    if (!pick) { card.hidden = true; if (src) src.hidden = true; return; }
    card.innerHTML = '';
    const ico = document.createElement('span'); ico.textContent = pick.ico;
    const txt = document.createElement('span'); txt.className = 'wx-txt';
    const when = document.createElement('span'); when.className = 'wx-when'; when.textContent = '이번 주말 ';
    const sep = document.createElement('span'); sep.className = 'wx-sep'; sep.textContent = '›';
    const tip = document.createElement('span'); tip.className = 'wx-tip'; tip.textContent = pick.tip;
    txt.appendChild(when); txt.appendChild(document.createTextNode(pick.state)); txt.appendChild(sep); txt.appendChild(tip);
    card.appendChild(ico); card.appendChild(txt);
    card.classList.toggle('static', !pick.key);
    card.hidden = false;
    if (src) src.hidden = false;
    window.syncWx();
  }
  // 바텀시트 헤더 칩: 선택한 지역의 예보가 로딩돼 있을 때만 '🌤️ 구름 조금 › 야외 추천'
  function renderSheetChip() {
    if (!sheetWx) return;
    if (!sheetRegion || !pick || pick.region !== sheetRegion) { sheetWx.hidden = true; return; }
    sheetWx.innerHTML = '';
    const ico = document.createElement('span'); ico.textContent = pick.ico;
    const sep = document.createElement('span'); sep.className = 'wx-sep'; sep.textContent = '›';
    const tip = document.createElement('span'); tip.className = 'wx-tip'; tip.textContent = pick.tip;
    sheetWx.appendChild(ico); sheetWx.appendChild(document.createTextNode('이번 주말 ' + pick.cond)); sheetWx.appendChild(sep); sheetWx.appendChild(tip);
    sheetWx.classList.toggle('static', !pick.key);
    sheetWx.hidden = false;
    window.syncWx();
  }
  window.syncWx = function () {
    const on = !!pick && !!pick.key && theme === pick.key;
    card.classList.toggle('active', on);
    if (sheetWx) sheetWx.classList.toggle('active', on);
  };
  // 지역 변경 훅: openSheet(key)에서는 그 지역, closeSheet에서는 null(기본 지역)
  window.wxSetRegion = function (key) {
    const region = COORD[key] ? key : DEFAULT_REGION;
    sheetRegion = COORD[key] ? key : null;     // 전국/미상/닫힘이면 시트 칩 없음
    if (region === current && pick) { renderSheetChip(); return; }
    if (sheetWx) sheetWx.hidden = true;        // 새 지역 예보를 받는 동안 이전 지역 칩이 남지 않게
    current = region;
    const my = ++token;
    load(region).then(function (daily) {
      if (my !== token) return;          // 그 사이 다른 지역으로 바뀌었으면 버린다
      pick = summarize(daily, region); render();
    }).catch(function () { if (my === token) { pick = null; render(); } });
  };
  function toggleFilter() {
    if (!pick || !pick.key) return;
    sendGaEvent('weather_card_click', { theme_key: pick.key, region: current });
    if (!(activeSub === 'all' || activeSub === 'free')) document.querySelector('.tab[data-sub="all"]').click();
    const chip = Array.prototype.find.call(document.querySelectorAll('#themeRow .theme-chip'), function (b) { return b.dataset.key === pick.key; });
    if (chip) chip.click();
  }
  card.addEventListener('click', toggleFilter);
  if (sheetWx) sheetWx.addEventListener('click', toggleFilter);
  pick = null; current = null; window.wxSetRegion(DEFAULT_REGION);
})();
</script>
<script>
// 새로고침 버튼 + 당겨서 새로고침 (홈 화면 추가 standalone 모드엔 주소창이 없어서)
(function () {
  var btn = document.getElementById('refreshBtn');
  var busy = false;
  function doReload() {
    if (busy) return; busy = true;
    if (btn) btn.classList.add('spin');
    setTimeout(function () { window.location.reload(); }, 450);
  }
  if (btn) btn.addEventListener('click', doReload);
  var ptr = document.createElement('div'); ptr.className = 'ptr'; ptr.innerHTML = '<i></i>'; document.body.appendChild(ptr);
  var sy = 0, sx = 0, pull = 0, active = false, TH = 70;
  function blocked(el) { // 스크롤 가능한 영역/지도/시트/모달 안에서 시작한 제스처는 제외
    for (; el && el !== document.documentElement; el = el.parentElement) {
      if (el.tagName === 'svg' || el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') return true;
      if (el.classList && (el.classList.contains('sheet') || el.classList.contains('sub-chips'))) return true;
      if (el.getAttribute && el.getAttribute('aria-modal') === 'true') return true;
      var cs = getComputedStyle(el), oy = cs.overflowY, ox = cs.overflowX;
      if (el !== document.body && ((/(auto|scroll)/.test(oy) && el.scrollHeight > el.clientHeight) || (/(auto|scroll)/.test(ox) && el.scrollWidth > el.clientWidth))) return true;
    }
    return false;
  }
  window.addEventListener('touchstart', function (e) {
    active = false; pull = 0;
    if (busy || e.touches.length !== 1 || (window.scrollY || 0) > 0 || document.body.classList.contains('sheet-open') || getComputedStyle(document.body).overflow === 'hidden' || blocked(e.target)) return;
    sy = e.touches[0].clientY; sx = e.touches[0].clientX; active = true;
  }, { passive: true });
  window.addEventListener('touchmove', function (e) {
    if (!active) return;
    var dy = e.touches[0].clientY - sy, dx = e.touches[0].clientX - sx;
    if (dy <= 0 || Math.abs(dx) > dy || (window.scrollY || 0) > 0) { active = false; ptr.style.opacity = 0; ptr.style.transform = 'translateY(-60px)'; return; }
    pull = Math.min(dy * 0.5, 90);
    ptr.style.transition = 'none'; ptr.style.opacity = Math.min(pull / TH, 1);
    ptr.style.transform = 'translateY(' + (pull - 50) + 'px) rotate(' + pull * 4 + 'deg)';
  }, { passive: true });
  function end() {
    if (!active) return; active = false;
    ptr.style.transition = 'transform .2s, opacity .2s';
    if (pull >= TH) { busy = true; ptr.classList.add('loading'); ptr.style.opacity = 1; ptr.style.transform = 'translateY(20px)'; setTimeout(function () { window.location.reload(); }, 350); }
    else { ptr.style.opacity = 0; ptr.style.transform = 'translateY(-60px)'; }
    pull = 0;
  }
  window.addEventListener('touchend', end, { passive: true });
  window.addEventListener('touchcancel', end, { passive: true });
})();
</script>
<script>
// PWA / 홈 화면 추가 GA4 추적 (index.html·map.html 공통, 템플릿에도 동일)
(function () {
  function ga(name, params) { try { if (typeof gtag === 'function') gtag('event', name, params || {}); } catch (e) {} }
  var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
  // 바탕화면 아이콘으로 열었을 때: 세션당 1회만
  if (standalone) {
    var sent = false;
    try { sent = sessionStorage.getItem('buygHomescreenOpened') === '1'; sessionStorage.setItem('buygHomescreenOpened', '1'); } catch (e) {}
    if (!sent) ga('opened_from_homescreen');
  }
  // 설치 가능 상태 알림(설치 완료가 아님) - 브라우저가 설치 안내를 띄울 수 있을 때, 세션당 1회
  window.addEventListener('beforeinstallprompt', function () {
    var sent = false;
    try { sent = sessionStorage.getItem('buygInstallPromptSeen') === '1'; sessionStorage.setItem('buygInstallPromptSeen', '1'); } catch (e) {}
    if (!sent) ga('pwa_install_prompt', { method: 'homescreen' });
  });
  // 실제 설치 완료
  window.addEventListener('appinstalled', function () { ga('pwa_installed', { method: 'homescreen' }); });
})();
</script>
